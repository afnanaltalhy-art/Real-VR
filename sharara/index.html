#app{position:fixed;top:78px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 12px 40px}
.card{width:min(980px,100%);max-height:100%;overflow:auto;background:rgba(255,255,255,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-radius:26px;padding:20px 22px;box-shadow:0 10px 40px rgba(40,20,90,.3);animation:pop .45s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
h1{margin:0 0 6px;color:var(--deep);font-size:clamp(24px,5vw,40px)}
h2{margin:0 0 8px;color:var(--deep);font-size:clamp(19px,3.6vw,28px)}
h3{margin:4px 0;color:var(--volt);font-size:clamp(16px,3vw,21px)}
p{line-height:1.8;margin:6px 0;font-size:clamp(14px,2.6vw,18px)}
.btn{font-family:inherit;font-weight:700;border:0;border-radius:40px;padding:12px 24px;font-size:clamp(15px,2.8vw,19px);color:#fff;background:var(--deep);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .1s;margin:4px}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.v{background:var(--volt)}.btn.g{background:var(--gold)}.btn.r{background:var(--pos)}.btn.c{background:var(--cyan)}.btn.b{background:var(--neg)}
.btn.sm{padding:9px 16px;font-size:clamp(13px,2.4vw,16px)}
.btn.on{outline:3px solid var(--gold);outline-offset:2px}
.hud{width:min(980px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.pill{background:rgba(255,255,255,.85);border-radius:30px;padding:7px 14px;font-weight:700;font-size:clamp(13px,2.4vw,17px);color:var(--deep);box-shadow:0 3px 10px rgba(0,0,0,.15);white-space:nowrap}
.meter{flex:1;height:14px;background:rgba(255,255,255,.6);border-radius:10px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#FFD24A,#7B4DDB,#1A9FC4);width:0;transition:width .8s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{font-family:inherit;font-weight:700;font-size:clamp(14px,2.7vw,19px);text-align:right;background:rgba(255,255,255,.85);border:2.5px solid #D9D1F2;border-radius:18px;padding:14px;cursor:pointer;color:var(--txt);transition:.2s}
.opt:hover{border-color:var(--volt)}
.opt.ok{background:#E3F5E9;border-color:var(--ok)}.opt.no{background:var(--posl);border-color:var(--pos);animation:shake .4s}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.fb{min-height:30px;font-weight:700;margin-top:10px;font-size:clamp(14px,2.6vw,18px);line-height:1.7}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.center{text-align:center}
.chip{display:inline-block;font-weight:700;background:var(--goldl);border:2.5px solid var(--gold);padding:12px 22px;border-radius:18px;font-size:clamp(17px,3.3vw,23px);animation:pop .3s}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.bk{border-radius:20px;padding:14px;min-height:120px;border:3px dashed;font-weight:700;cursor:pointer;text-align:center;font-size:clamp(15px,2.8vw,20px)}
.bk.x{background:rgba(221,243,250,.85);border-color:var(--cyan);color:#0d5d74}.bk.y{background:rgba(238,231,251,.85);border-color:var(--volt);color:#4b2b94}
.bk span{display:inline-block;margin:4px;padding:4px 10px;background:#fff;border-radius:12px;font-size:14px}
.timer{height:10px;background:#E6E1F5;border-radius:8px;overflow:hidden;margin-top:6px}.timer i{display:block;height:100%;background:var(--gold);width:100%}
.char{width:min(300px,70vw);border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
input{font-family:inherit;font-size:18px;padding:10px 16px;border-radius:30px;border:2.5px solid var(--volt);text-align:center;width:min(320px,90%)}
.cert{border:4px double var(--gold);border-radius:22px;padding:16px;text-align:center;background:linear-gradient(rgba(255,253,247,.7),rgba(255,243,204,.8))}
.foot{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;font-weight:700;pointer-events:none}
.order{position:fixed;bottom:5px;left:8px;font-family:inherit;font-weight:700;font-size:12px;border:0;border-radius:20px;padding:5px 12px;background:rgba(255,255,255,.88);color:var(--deep);cursor:pointer;z-index:6}
#ord{display:none;position:fixed;bottom:36px;left:8px;background:#fff;border-radius:14px;padding:8px 14px;font-weight:700;color:var(--deep);box-shadow:0 4px 14px rgba(0,0,0,.25);direction:rtl;z-index:6}
.top{position:fixed;top:0;left:0;right:0;height:74px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px;background:rgba(255,255,255,.82);backdrop-filter:blur(2px);box-shadow:0 2px 10px rgba(40,20,90,.18);z-index:5}
.top .sch{font-weight:700;font-size:clamp(11px,2.2vw,15px);line-height:1.6;color:var(--deep);text-align:right;flex:1}
.top .tch{font-weight:700;font-size:clamp(14px,3.2vw,22px);color:#fff;background:linear-gradient(90deg,#4B3FA8,#7B4DDB,#1A9FC4);box-shadow:0 3px 8px rgba(40,20,90,.25);padding:6px 16px;border-radius:30px;white-space:nowrap}
.top .lg{flex:1;display:flex;justify-content:flex-end}.top img{height:56px}
.spark{position:fixed;pointer-events:none;font-size:22px;animation:fly 1.6s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.pair{display:flex;justify-content:center;align-items:center;gap:0;margin:10px 0}
.lab svg{width:100%;max-width:640px;display:block;margin:6px auto;background:rgba(255,255,255,.6);border-radius:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0 10px}
.sel{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;margin:4px 0}
.sel b{font-size:15px;color:var(--deep)}
.note{background:var(--voltl);border-right:5px solid var(--volt);border-radius:12px;padding:8px 12px;font-weight:700;font-size:clamp(13px,2.5vw,17px);line-height:1.8;margin-top:8px}
.series{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:700;max-width:180px}
.series span{padding:2px 8px;border-radius:8px;color:#fff;text-align:center}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.top .sch{font-size:10px}.top img{height:44px}}
</style>

const A=document.getElementById('app');
let pname="",score=0,sparks=0,level=0;
/* ---------- sound (WebAudio, no files) ---------- */
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
let muted=false,amb=null;
function tone(f,d,t='sine',v=.18,delay=0){const c=ac();if(!c||muted)return;const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+delay;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.05)}
function noise(sec){const c=ac();const n=Math.floor(c.sampleRate*sec),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;return b}
function crackle(v=.25,dur=.25){const c=ac();if(!c||muted)return;const s=c.createBufferSource();s.buffer=noise(dur);const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=2500;const g=c.createGain();const t=c.currentTime;g.gain.setValueAtTime(0,t);for(let i=0;i<8;i++){const k=t+Math.random()*dur;g.gain.setValueAtTime(v*Math.random(),k);g.gain.setValueAtTime(0,k+.008)}s.connect(hp);hp.connect(g);g.connect(c.destination);s.start()}
function zap(){const c=ac();if(!c||muted)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(1800,t);o.frequency.exponentialRampToValueAtTime(120,t+.18);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.22);crackle(.3,.2)}
function rubSnd(){const c=ac();if(!c||muted)return;const s=c.createBufferSource();s.buffer=noise(.35);const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1200;bp.Q.value=.7;const g=c.createGain(),t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.08);g.gain.linearRampToValueAtTime(0,t+.35);s.connect(bp);bp.connect(g);g.connect(c.destination);s.start()}
function hum(){const c=ac();if(!c||amb)return;const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain();o.frequency.value=60;o2.frequency.value=120;o.type='sine';o2.type='sine';g.gain.value=muted?0:.025;o.connect(g);o2.connect(g);g.connect(c.destination);o.start();o2.start();amb=g;setInterval(()=>{if(!muted&&Math.random()<.35)crackle(.06,.12)},3200)}
function toggleMute(){muted=!muted;if(amb)amb.gain.value=muted?0:.025;document.getElementById('mt').textContent=muted?'🔇':'🔊'}
const S={ok(){tone(660,.12,'triangle');tone(990,.18,'triangle',.18,.1);crackle(.12,.15)},no(){tone(180,.3,'square',.08);tone(140,.35,'square',.07,.12)},pop(){tone(880,.07,'sine',.12)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.18,i*.13));setTimeout(zap,600)}};
document.addEventListener('pointerdown',()=>hum(),{once:true});
function burst(n=10,x=innerWidth/2,y=innerHeight/2){for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';s.textContent=Math.random()<.5?'⚡':'✨';s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--dx',(Math.random()*360-180)+'px');s.style.setProperty('--dy',(Math.random()*-300-40)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1700)}}
function hud(){return `<div class="hud"><span class="pill">⚡ ${pname||'الباحثة'}</span><div class="meter"><i style="width:${level*20}%"></i></div><span class="pill" id="sc">⚡ ${sparks} شرارة • ${score} نقطة</span></div>`}
function upd(){const e=document.getElementById('sc');if(e)e.textContent=`⚡ ${sparks} شرارة • ${score} نقطة`}
function view(html,withHud=true){A.innerHTML=(withHud?hud():'')+`<div class="card">${html}</div>`}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
function gain(p){score+=p;sparks++;S.ok();burst(8);upd()}
const say=(t,c)=>`<span style="color:${c==1?'var(--ok)':'var(--pos)'}">${t}</span>`;

/* ---------- start ---------- */
function start(){level=0;view(`<div class="row"><img class="char" src="${CHAR}"><div style="flex:1;min-width:260px">
<h1>مغامرة صائدة الشرارات ⚡</h1><p>كوني باحثة في مختبر الكهرباء الساكنة! اجمعي الشرارات بحلّ تحدّيات درس <b>الشحنة الكهربائية</b>: أربع محطات، ومختبر إلكتروني تجرّبين فيه بنفسك.</p>
<p><input id="nm" placeholder="اكتبي اسمك هنا"></p>
<p><button class="btn v" onclick="setName();intro1()">ابدئي المغامرة ⚡</button><button class="btn c" onclick="setName();labHome()">🧪 المختبر الإلكتروني</button></p></div></div>`,false)}
function setName(){const e=document.getElementById('nm');if(e)pname=(e.value||'').trim()||'الباحثة';S.pop()}

/* ---------- level 1: attract / repel ---------- */
function ball(sign,lab){const col=sign=='+'?'var(--pos)':sign=='-'?'var(--neg)':'#9a93b8';const t=sign=='+'?'+':sign=='-'?'−':'0';return `<div style="text-align:center"><div style="width:clamp(70px,16vw,100px);height:clamp(70px,16vw,100px);border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,${col});display:grid;place-items:center;font-size:clamp(34px,7vw,50px);font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.4);margin:auto">${t}</div><div style="font-weight:700;font-size:14px;margin-top:4px">${lab}</div></div>`}
const L1=shuffle([
 ["+","+","جسم موجب","جسم موجب",0,"الشحنات المتماثلة تتنافر."],
 ["-","-","جسم سالب","جسم سالب",0,"الشحنات المتماثلة تتنافر."],
 ["+","-","جسم موجب","جسم سالب",1,"الشحنات المختلفة تتجاذب."],
 ["-","+","الشريط B","الشريط T",1,"الشريطان B وT فُصلا معًا فأصبحا مشحونين بشحنتين مختلفتين، فيتجاذبان."],
 ["-","-","شريط من الطاولة","شريط آخر من الطاولة",0,"شُحنا بالطريقة نفسها فلهما النوع نفسه من الشحنة، فيتنافران."],
 ["-","0","مسطرة مدلوكة بالصوف","قصاصة ورق",1,"الجسم المشحون يجذب قصاصات الورق، وقوة الجذب أكبر من قوة الجاذبية الأرضية عليها."]]);
let i1=0,t1=0;
function intro1(){level=0;i1=0;view(`<h2>المحطة 1: تجاذب أم تنافر؟ 🧲</h2><p>سيظهر جسمان مشحونان… قرّري: هل يتجاذبان أم يتنافران؟ لكل إجابة صحيحة من المحاولة الأولى شرارة و10 نقاط.</p><p class="center"><button class="btn v" onclick="S.pop();lv1()">هيّا!</button></p>`)}
function lv1(){t1=0;const [a,b,la,lb,k,why]=L1[i1];view(`<h2>المحطة 1 (${i1+1}/${L1.length})</h2><div class="pair" id="pr">${ball(a,la)}<div id="gap" style="width:120px;transition:width .6s;text-align:center;font-size:28px">↔</div>${ball(b,lb)}</div>
<div class="grid2"><button class="opt" data-v="1">🤝 يتجاذبان</button><button class="opt" data-v="0">↔️ يتنافران</button></div><div class="fb" id="fb"></div><div id="nx" class="center"></div>`);
 document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{if(document.getElementById('nx').innerHTML)return;
  if(+o.dataset.v===k){o.classList.add('ok');if(t1===0)gain(10);else S.ok();const g=document.getElementById('gap');g.style.width=k?'8px':'230px';g.textContent=k?'':'⟵ ⟶';
   document.getElementById('fb').innerHTML=say('✓ أحسنتِ! '+why,1);document.getElementById('nx').innerHTML=`<button class="btn g" onclick="S.pop();i1++;i1<L1.length?lv1():intro2()">التالي ←</button>`}
  else{t1++;o.classList.add('no');S.no();setTimeout(()=>o.classList.remove('no'),400);document.getElementById('fb').innerHTML=say('✗ فكّري في نوعي الشحنتين… حاولي مرة أخرى',0)}})}

/* ---------- triboelectric series ---------- */
const SER=["يد الإنسان","زجاج","شعر الإنسان","نايلون","صوف","فراء الحيوانات","حرير","ألومنيوم","ورق","قطن","خشب","عنبر","مطاط البالونات","مطاط صلب (إيبونايت)","نيكل ونحاس وفضة وذهب","بوليستر","بولي إيثيلين","تيفلون"];
function serHTML(hi=[]){return `<div class="series"><small style="color:var(--pos)">▲ تفقد الإلكترونات (موجبة)</small>${SER.map((s,i)=>{const h=Math.round(i/(SER.length-1)*240);return `<span style="background:hsl(${h},70%,${hi.includes(s)?38:55}%);${hi.includes(s)?'outline:3px solid #222;':''}">${s}</span>`}).join('')}<small style="color:var(--neg)">▼ تكتسب الإلكترونات (سالبة)</small></div>`}
/* ---------- level 2: rubbing ---------- */
const L2=shuffle([["بالون مطاطي","مطاط البالونات","قطعة صوف","صوف"],["قضيب زجاجي","زجاج","قطعة حرير","حرير"],["قضيب مطاط صلب","مطاط صلب (إيبونايت)","فراء حيوان","فراء الحيوانات"],["بالون مطاطي","مطاط البالونات","شعر الإنسان","شعر الإنسان"],["كيس بولي إيثيلين","بولي إيثيلين","قطعة صوف","صوف"],["شريط تيفلون","تيفلون","قماش نايلون","نايلون"]]);

["تكون الذرة متعادلة عندما:",["تفقد إلكتروناتها الخارجية","تساوي شحنة نواتها الموجبة شحنة إلكتروناتها السالبة","تكتسب إلكترونًا إضافيًّا","تخلو من النواة"],1],
["اكتشف أن المواد جميعها تحتوي على الإلكترونات عام 1897م:",["فرانكلين","رذرفورد","طومسون","كافندش"],2],
["كلمة «إلكترون» تعود إلى كلمة يونانية تعني:",["البرق","الكهرمان","الشرارة","الذرة"],1],
["عند وضع شحنات على موصل فإنها:",["تبقى في مكان وضعها","تتوزّع على كامل سطحه الخارجي","تختفي فورًا","تتجمّع في مركزه"],1],
["وفق تسمية فرانكلين، يُشحن الزجاج المدلوك بالحرير بشحنة:",["سالبة","موجبة","متعادلة","سالبة وموجبة معًا"],1],
["تحدث شرارة بين إصبعك ومقبض الباب الفلزي لأن الهواء:",["عازل دائمًا","يصبح موصلًا للحظات فتُفرَّغ الشحنات","مشحون بشحنة موجبة","يمتص الإلكترونات"],1],
["فقد المشط المدلوك قدرته على جذب الورق بعد دقائق لأنه:",["فقد شحنته إلى ما حوله فأصبح متعادلًا","اكتسب بروتونات","أصبح موصلًا","تغيّر لونه"],0],
["تتكوّن الشحنات الكهربائية دائمًا:",["شحنة موجبة فقط","على شكل أزواج: موجبة وسالبة","شحنة سالبة فقط","في الموصلات فقط"],1]]).slice(0,8);
let i4=0,tmr=null;
function intro4(){level=3;i4=0;view(`<h2>المحطة 4: سباق الشرارات ⏱</h2><p>ثمانية أسئلة سريعة، لكل سؤال 20 ثانية. الإجابة الأسرع تمنحك نقاطًا إضافية!</p><p class="center"><button class="btn r" onclick="S.pop();lv4()">انطلقي!</button></p>`)}

 <p>${st===3?'باحثة خبيرة بالشحنة الكهربائية! 🌟':st===2?'أداء رائع… راجعي ما أخطأتِ فيه لتصبحي خبيرة!':'بداية جميلة! أعيدي المحاولة لتجمعي شرارات أكثر.'}</p>

/* =================== المختبر الإلكتروني =================== */
let labRet=false;

<div class="grid2"><button class="opt" onclick="S.pop();labRub()">🧶 <b>تجربة 1:</b> الشحن بالدلك وانتقال الإلكترونات</button><button class="opt" onclick="S.pop();labTape()">🎗 <b>تجربة 2:</b> الشريطان اللاصقان B وT</button><button class="opt" onclick="S.pop();labCond()">🔌 <b>تجربة 3:</b> موصل أم عازل؟</button><button class="opt" onclick="S.pop();labSpark()">🚪 <b>تجربة 4:</b> شرارة مقبض الباب</button></div>

/* --- تجربة 1: الدلك --- */
const RODS=[["بالون مطاطي","مطاط البالونات"],["قضيب زجاجي","زجاج"],["قضيب مطاط صلب","مطاط صلب (إيبونايت)"],["مسطرة بلاستيكية (بولي إيثيلين)","بولي إيثيلين"]];
const CLOTHS=[["صوف","صوف"],["حرير","حرير"],["شعر الإنسان","شعر الإنسان"],["فراء حيوان","فراء الحيوانات"]];
let R=0,C=0,moved=0;
function bodySVG(x,label,col,qBody){// 6 protons + (6+q) electrons
 const ne=6-qBody;let s=`<rect x="${x}" y="40" width="200" height="120" rx="22" fill="${col}" stroke="#4b3f8f" stroke-width="2"/><text x="${x+100}" y="185" text-anchor="middle" font-size="17" font-weight="700" fill="#2E2A6B">${label}</text>`;
 const e=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="10" fill="#2F7BE0"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-size="16" fill="#fff" font-weight="700">−</text>`;
 for(let i=0;i<6;i++){const cx=x+35+(i%3)*65,cy=82+Math.floor(i/3)*44;s+=`<circle cx="${cx}" cy="${cy}" r="12" fill="#E04B4B"/><text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">+</text>`;if(i<ne)s+=e(cx+24,cy)}
 for(let k=0;k<ne-6;k++)s+=e(x+22+k*32,54);
 return s}
function labRub(){moved=0;drawRub()}
function drawRub(fly){const [rn,rs]=RODS[R],[cn,cs]=CLOTHS[C];const ri=SER.indexOf(rs),ci=SER.indexOf(cs);const dir=ri>ci?1:-1;// 1: electrons go cloth->rod
 const qRod=-dir*moved,qCl=dir*moved;
 const fmt=q=>'\u200e'+(q>0?`+${q}`:q<0?`−${-q}`:'0')+'\u200e';
 view(`<h2>🧶 تجربة 1: الشحن بالدلك</h2>
<div class="sel"><b>الجسم:</b>${RODS.map((r,i)=>`<button class="btn sm ${i==R?'on':''}" style="background:var(--volt)" onclick="R=${i};moved=0;S.pop();drawRub()">${r[0]}</button>`).join('')}</div>
<div class="sel"><b>قطعة الدلك:</b>${CLOTHS.map((r,i)=>`<button class="btn sm ${i==C?'on':''}" style="background:var(--cyan)" onclick="C=${i};moved=0;S.pop();drawRub()">${r[0]}</button>`).join('')}</div>
<div class="lab"><svg viewBox="0 0 640 230" id="rsv">${bodySVG(380,rn+' ('+fmt(qRod)+')','#F3EEFF',qRod)}${bodySVG(60,cn+' ('+fmt(qCl)+')','#E3F6FB',qCl)}<text x="320" y="110" text-anchor="middle" font-size="30">⇄</text>${fly?`<circle r="11" fill="#2F7BE0" stroke="#FFD24A" stroke-width="3"><animate attributeName="cx" from="${dir>0?160:480}" to="${dir>0?480:160}" dur=".7s" fill="freeze"/><animate attributeName="cy" values="20;5;20" dur=".7s" fill="freeze"/></circle>`:''}</svg></div>
<p class="center"><button class="btn g" onclick="rub()">🖐 ادلكي (${moved}/5)</button><button class="btn sm" onclick="moved=0;S.pop();drawRub()">↺ إعادة</button> ${back}</p>
<div class="note">شحنة ${rn}: <b style="color:${qRod<0?'var(--neg)':qRod>0?'var(--pos)':'inherit'}">${fmt(qRod)}</b> &nbsp;•&nbsp; شحنة ${cn}: <b style="color:${qCl<0?'var(--neg)':qCl>0?'var(--pos)':'inherit'}">${fmt(qCl)}</b> &nbsp;•&nbsp; المجموع الكلي: <b>0</b> ✓ الشحنة محفوظة<br>${moved?`${dir>0?cn:rn} أعلى في سلسلة الدلك الكهربائي، فيفقد إلكترونات ويصبح موجبًا، و${dir>0?rn:cn} يكتسبها فيصبح سالبًا. الشحن فصلٌ للشحنات لا إنتاجٌ لها.`:'اضغطي «ادلكي» وراقبي الإلكترونات الزرقاء (−) وهي تنتقل. البروتونات الحمراء (+) في النوى لا تنتقل.'}</div>`)}

/* --- تجربة 2: الأشرطة --- */
const TAPE=[["شريطان سُحبا من سطح الطاولة",-28,28,"",`لهما النوع نفسه من الشحنة لأنهما شُحنا بالطريقة نفسها، <b>فيتنافران</b>.`,"B","B"],
["الشريط B والشريط T بعد فصلهما معًا",12,-12,"",`أصبحا مشحونين بشحنتين مختلفتين، <b>فيتجاذبان</b>.`,"B","T"],
["قرّبي مشطًا مدلوكًا بالصوف بينهما",-26,-14,"comb",`المشط يتنافر مع أحد الشريطين ويجذب الآخر: <b>لا يوجد إلا نوعان من الشحنات</b>.`,"B","T"],
["قرّبي إصبعك بينهما",14,-14,"finger",`إصبعك يجذب كلا الشريطين؛ سنكتشف سبب ذلك لاحقًا في الفصل.`,"B","T"]];

function strip(x,ang,lab){const col=lab=='B'?'#F6D53B':'#F4B740';return `<g style="transform-origin:${x}px 52px;transform:rotate(${ang}deg);transition:transform .9s cubic-bezier(.3,1.6,.5,1)"><rect x="${x-12}" y="52" width="24" height="120" rx="6" fill="${col}" stroke="#c99a00"/><text x="${x}" y="160" text-anchor="middle" font-size="18" font-weight="700" fill="#5a4200">${lab}</text></g>`}
function drawTape(){const s=tp>=0?TAPE[tp]:null;const a1=s?s[1]:0,a2=s?s[2]:0;

${s&&s[3]=='comb'?`<g><rect x="290" y="185" width="60" height="16" rx="4" fill="#333"/>${[0,1,2,3,4,5].map(i=>`<rect x="${294+i*9}" y="170" width="4" height="16" fill="#333"/>`).join('')}<text x="320" y="222" text-anchor="middle" font-size="14" font-weight="700">مشط (−)</text></g>`:''}${s&&s[3]=='finger'?`<text x="320" y="215" text-anchor="middle" font-size="44">👆</text>`:''}</svg></div>
<div class="grid2">${TAPE.map((t,i)=>`<button class="opt ${i==tp?'ok':''}" onclick="tp=${i};${i>=2?'crackle(.15,.2)':'rubSnd()'};drawTape()">${t[0]}</button>`).join('')}</div>
<div class="note">${s?s[4]:'B: الشريط السفلي، T: الشريط العلوي (كما في الشكل 8-2).'}</div><p class="center">${back}</p>`)}

/* --- تجربة 3: موصل أم عازل --- */
let cm=0,ct=0;
function labCond(){ct=0;drawCond()}
const pc=(x,y)=>`<circle cx="${x}" cy="${y}" r="9" fill="#fff" stroke="#E04B4B" stroke-width="2"/><text x="${x}" y="${y+6}" text-anchor="middle" font-size="17" fill="#E04B4B" font-weight="700">+</text>`;

<div class="lab"><svg viewBox="0 0 640 200"><rect x="110" y="88" width="10" height="90" fill="#cfc6ea"/><rect x="40" y="172" width="150" height="14" rx="6" fill="#8f86b5"/><text x="115" y="198" text-anchor="middle" font-size="12" font-weight="700">حامل عازل</text>
<rect x="120" y="80" width="400" height="40" rx="20" fill="${metal?'url(#cu)':'#C9B8F3'}" stroke="#5b4a99"/><defs><linearGradient id="cu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0B27A"/><stop offset=".5" stop-color="#B87333"/><stop offset="1" stop-color="#8E5427"/></linearGradient></defs>${ch}
<g style="transition:transform .8s;transform:translateX(${ct?0:60}px)"><rect x="525" y="90" width="110" height="20" rx="10" fill="#d9ecf5" stroke="#6aa"/><text x="580" y="140" text-anchor="middle" font-size="13" font-weight="700">قضيب زجاجي موجب</text>${[540,560,580,600,620].map(x=>`<text x="${x}" y="106" text-anchor="middle" font-size="14" fill="#E04B4B" font-weight="700">+</text>`).join('')}</g></svg></div>
<p class="center"><button class="btn g" onclick="ct=1;zap();drawCond()">⚡ المسي طرف القضيب بالقضيب المشحون</button> ${back}</p>
<div class="note">${!ct?'اختاري نوع القضيب، ثم المسي طرفه الأيسر بقضيب زجاجي مشحون بشحنة موجبة، وراقبي أين تستقر الشحنات.':metal?'<b>مادة موصلة:</b> انتشرت الشحنات بسرعة على كامل السطح الخارجي للقضيب الفلزي؛ لأن إلكترونات الفلز حرّة الحركة (الشكل 8-5a).':'<b>مادة عازلة:</b> بقيت الشحنات في المكان الذي وُضعت فيه فقط؛ لأن الشحنات لا تنتقل خلال العازل (الشكل 8-5b).'}</div>`)}

/* --- تجربة 4: الشرارة --- */

 <div style="font-size:28px;font-weight:800;color:var(--vio)">${S.name||'............'}</div><p>جمعت ${n} من ${ST.length} أختام في رحلة الباتيك حول العالم</p><div style="font-size:28px">${ST.map(s=>S.done.includes(s.k)?s.f:'⬚').join(' ')}</div>
 <p style="color:var(--hot);font-weight:800">${n===ST.length?'رحّالة الباتيك الأولى! ✨':'أكملي بقية المحطات للحصول على الشهادة كاملة 💪'}</p><p style="font-size:13px">إعداد المعلمة: أ. نوف الشريف</p></div>`;if(n===ST.length)play('aOk')}

<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مختبر الصخور المعزز</title>
<meta name="theme-color" content="#060c17">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
<script type="importmap">{"imports":{"three":"../habitats/lib/three.module.js","three/addons/":"../habitats/lib/addons/"}}</script>
<style>
[hidden]{display:none!important}
:root{
  --ink:#eaf3ff; --muted:#a3b6cf; --glass:rgba(8,15,28,.82); --glass2:rgba(20,32,54,.9);
  --line:rgba(150,200,255,.2); --accent:#3ee6c8; --accent-ink:#04211c; --amber:#ffc247;
  --good:#5ff0b5; --bad:#ff7a7a; --pw:min(400px,44vw);
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#060c17;color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:fixed;inset:0}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lab{background:
  radial-gradient(ellipse at 50% 40%,rgba(62,230,200,.10),transparent 60%),
  linear-gradient(rgba(140,190,255,.05) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(140,190,255,.05) 1px,transparent 1px) 0 0/40px 40px,
  #060c17}
#gl,#lb{position:absolute;inset:0;width:100%;height:100%}
#gl{touch-action:none;cursor:grab}#gl:active{cursor:grabbing}
#lb{pointer-events:none}

.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(6,12,23,.85),rgba(6,12,23,0));pointer-events:none;z-index:2}
.top > *{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand b{font-family:var(--display);font-size:17px;font-weight:700}
.brand span{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 13px var(--body);color:var(--ink);background:var(--glass2);border:1px solid var(--line);border-radius:999px;
  padding:8px 13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.hint{position:absolute;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);background:var(--glass);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap;transition:opacity .6s;pointer-events:none;z-index:2}

.panel{position:absolute;bottom:0;left:0;right:0;margin-inline:auto;max-width:780px;background:var(--glass);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:10px;z-index:3;max-height:62vh;overflow-y:auto}
.grab{align-self:center;width:54px;height:20px;border:0;background:none;cursor:pointer;display:grid;place-items:center;flex:none}
.grab::before{content:"";width:40px;height:4px;border-radius:4px;background:rgba(200,220,255,.35)}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;flex:none}
.row::-webkit-scrollbar{display:none}
.tab{font:600 14px var(--display);color:var(--muted);background:none;border:1px solid transparent;border-radius:10px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:rgba(62,230,200,.12);border-color:rgba(62,230,200,.45)}
.chip{font:500 13px var(--body);color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip i{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-current="true"]{background:var(--amber);color:#2a1d00;border-color:var(--amber)}
.chip[aria-current="true"] i{color:#5a4200}
.card{display:flex;flex-direction:column;gap:4px;min-width:0}
.card h2{margin:0;font:700 19px/1.35 var(--display);text-wrap:balance}
.tag{font-size:12.5px;color:var(--accent);font-weight:600}
.card p{margin:0;font-size:14.5px;line-height:1.75;color:#d5e2f3;max-width:65ch}
.card .fact{font-size:13px;color:var(--amber);line-height:1.6}
.origin{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;background:rgba(62,230,200,.1);border:1px solid rgba(62,230,200,.35);border-radius:8px;padding:4px 10px;align-self:flex-start}
.compact .card p,.compact .card .origin,.compact #quizBox .why{display:none}
.controls{display:flex;gap:8px;flex-wrap:wrap;flex:none}
.controls .btn{flex:1 1 auto;justify-content:center}
.quiz{display:flex;flex-direction:column;gap:8px}
.quiz h2{margin:0;font:700 18px/1.5 var(--display)}
.qmeta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:600 14px var(--body);color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:center;line-height:1.5}
.opt.ok{background:rgba(95,240,181,.2);border-color:var(--good)}
.opt.no{background:rgba(255,122,122,.18);border-color:var(--bad)}
.why{font-size:13.5px;line-height:1.7;color:#d5e2f3;margin:0}
.final{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.final .big{font:700 34px var(--display);color:var(--amber)}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);width:min(92%,520px);
  background:var(--glass2);border:1px solid var(--amber);border-radius:12px;padding:10px 14px;font-size:13.5px;line-height:1.8;z-index:5;white-space:pre-line}

/* landscape: lesson panel becomes a side sheet, model uses the remaining space */
@media (orientation:landscape) and (min-width:640px){
  .top{right:var(--pw)}
  .panel{top:0;bottom:0;right:0;left:auto;width:var(--pw);max-width:none;max-height:none;margin:0;border-radius:0;
    border:0;border-left:1px solid var(--line);padding-top:calc(env(safe-area-inset-top,0px) + 10px);justify-content:flex-start}
  .panel .controls{margin-top:auto}
  .grab{display:none}
  .opts{grid-template-columns:1fr}
  .toast{left:calc((100% - var(--pw))/2)}
}
@media (prefers-reduced-motion:reduce){.hint{transition:none}}
</style>
</head><body><div id="app" dir="rtl">
  <div class="bg lab"></div>
  <video class="bg" id="video" playsinline muted hidden></video>
  <img class="bg" id="photo" alt="" hidden>
  <canvas id="gl" aria-label="نموذج ثلاثي الأبعاد للصخرة"></canvas>
  <canvas id="lb" aria-hidden="true"></canvas>

  <header class="top" id="top">
    <div class="brand"><b>مختبر الصخور المعزز</b><span>العلوم · أول متوسط · د. أفنان الطلحي</span></div>
    <div class="tools">
      <button class="btn" id="camBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/></svg><span>تشغيل الكاميرا</span></button>
      <label class="btn" for="snap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>صورة</label>
      <input type="file" id="snap" accept="image/*" capture="environment" hidden>
      <button class="btn on" id="lblBtn" type="button" aria-pressed="true">البطاقات</button>
      <button class="btn" id="infoBtn" type="button" aria-label="عن المختبر">ⓘ</button>
    </div>
  </header>
  <div class="hint" id="hint">اسحبي لتدوير الصخرة · قرّبي بإصبعين للتكبير · نقرتان للإرجاع</div>
  <div class="toast" id="toast" hidden role="status"></div>

  <section class="panel" id="panel">
    <button class="grab" id="grab" type="button" aria-label="تصغير اللوحة أو توسيعها"></button>
    <div class="row" id="tabs" role="tablist"></div>
    <div class="row" id="chips"></div>
    <div class="card" id="card">
      <span class="tag" id="tag"></span>
      <h2 id="ttl"></h2>
      <span class="origin" id="origin" hidden></span>
      <p id="desc"></p>
      <p class="fact" id="fact"></p>
    </div>
    <div class="quiz" id="quizBox" hidden>
      <div class="qmeta"><span id="qNum"></span><span id="score"></span></div>
      <div class="bar"><i id="qBar"></i></div>
      <h2 id="qTitle"></h2>
      <div class="opts" id="opts"></div>
      <p class="why" id="why"></p>
      <div class="final" id="final" hidden><span class="big" id="finalScore"></span><span id="finalMsg"></span></div>
    </div>
    <div class="controls">
      <button class="btn" id="prev" type="button">→ السابق</button>
      <button class="btn" id="play" type="button">إيقاف</button>
      <button class="btn" id="next" type="button">التالي ←</button>
      <button class="btn" id="quizBtn" type="button">اختبري نفسك</button>
    </div>
  </section>
</div>

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';

const TAU=Math.PI*2, PI=Math.PI;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- noise ---------- */
function mkNoise(seed){const r=rng(seed),p=new Uint8Array(512),q=[...Array(256).keys()];
  for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[q[i],q[j]]=[q[j],q[i]]}for(let i=0;i<512;i++)p[i]=q[i&255];
  const fade=t=>t*t*t*(t*(t*6-15)+10),L=(a,b,t)=>a+t*(b-a);
  const gr=(h,x,y,z)=>{h&=15;const u=h<8?x:y,v=h<4?y:(h===12||h===14?x:z);return((h&1)?-u:u)+((h&2)?-v:v)};
  return(x,y,z)=>{const fx=Math.floor(x),fy=Math.floor(y),fz=Math.floor(z),X=fx&255,Y=fy&255,Z=fz&255;x-=fx;y-=fy;z-=fz;
    const u=fade(x),v=fade(y),w=fade(z),A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
    return L(L(L(gr(p[AA],x,y,z),gr(p[BA],x-1,y,z),u),L(gr(p[AB],x,y-1,z),gr(p[BB],x-1,y-1,z),u),v),
             L(L(gr(p[AA+1],x,y,z-1),gr(p[BA+1],x-1,y,z-1),u),L(gr(p[AB+1],x,y-1,z-1),gr(p[BB+1],x-1,y-1,z-1),u),v),w)}}
const N=mkNoise(7);
const fbm=(x,y,z,o=4)=>{let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*N(x*f,y*f,z*f);a*=.5;f*=2.03}return s};

/* ---------- geometry helpers ---------- */
const C=h=>new THREE.Color(h);
const tmp=new THREE.Color();
const mixc=(a,b,t)=>tmp.copy(a).lerp(b,clamp(t));
function blobR(seed,amp,freq){return(x,y,z)=>1+amp*fbm(x*freq+seed,y*freq+seed*.7,z*freq-seed)}
function facetR(seed,n,h0,h1,rough=0,cap=1.3){const r=rng(seed),P=[];
  for(let i=0;i<n;i++){const v=new THREE.Vector3(r()*2-1,r()*2-1,r()*2-1).normalize();P.push([v.x,v.y,v.z,h0+r()*(h1-h0)])}
  return(x,y,z)=>{let m=cap;for(const p of P){const d=x*p[0]+y*p[1]+z*p[2];if(d>.05)m=Math.min(m,p[3]/d)}
    return m+(rough?rough*fbm(x*2+seed,y*2,z*2):0)}}
function rockMesh({detail=40,R,scale=[1,1,1],color,mat={}}){
  let g=new THREE.IcosahedronGeometry(1,detail);g.deleteAttribute('normal');g.deleteAttribute('uv');g=mergeVertices(g);
  const pos=g.attributes.position,n=pos.count,col=new Float32Array(n*3),v=new THREE.Vector3();
  for(let i=0;i<n;i++){v.fromBufferAttribute(pos,i).normalize();const r=R(v.x,v.y,v.z);
    const x=v.x*r*scale[0],y=v.y*r*scale[1],z=v.z*r*scale[2];pos.setXYZ(i,x,y,z);
    const c=color(x,y,z,v.x,v.y,v.z);col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}
  g.setAttribute('color',new THREE.BufferAttribute(col,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshPhysicalMaterial({vertexColors:true,roughness:.85,metalness:0,...mat}));
  m.userData.surf=(d)=>{const u=new THREE.Vector3(...d).normalize(),r=R(u.x,u.y,u.z);return new THREE.Vector3(u.x*r*scale[0],u.y*r*scale[1],u.z*r*scale[2])};
  return m}
function grain(x,y,z,f,a){return 1+a*N(x*f+11,y*f+3,z*f+7)}
const shade=(c,k)=>{c.r*=k;c.g*=k;c.b*=k;return c};
function fib(n,seed=1){const r=rng(seed),out=[];for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,rr=Math.sqrt(1-y*y),t=i*2.399963+r()*.4;out.push(new THREE.Vector3(Math.cos(t)*rr,y,Math.sin(t)*rr))}return out}
const glassy=(color,op=.6)=>new THREE.MeshPhysicalMaterial({color,roughness:.06,metalness:0,transparent:true,opacity:op,clearcoat:1,clearcoatRoughness:.05,envMapIntensity:1.4});

/* ---------- rock & mineral builders ---------- */
const P={pink:C('#d79b86'),pink2:C('#c4806c'),qtz:C('#c9c8c2'),wht:C('#ece6dc'),blk:C('#1b1b1d'),
  bas:C('#2f3032'),bas2:C('#3d3d3f'),obs:C('#07080a'),obs2:C('#1b1e26'),pum:C('#d9d4c7'),pum2:C('#8d877a'),
  sand1:C('#dba468'),sand2:C('#b77441'),sand3:C('#ecc995'),sh1:C('#5a5d61'),sh2:C('#43464a'),
  lime:C('#cdbf9b'),lime2:C('#a4967a'),coal:C('#141414'),coal2:C('#232324'),sl:C('#3c4552'),sl2:C('#2e3540'),
  sc:C('#7c8174'),sc2:C('#d8dad9'),gar:C('#7b1e2a'),gn1:C('#ece2d4'),gn2:C('#25252a'),gn3:C('#8b857f'),gnp:C('#d9a08b'),
  mar:C('#f4f2ed'),vein:C('#6f737b'),qz1:C('#dfbcb0'),qz2:C('#f0dcd3'),mat:C('#a98b62'),mat2:C('#8e7350')};

const B={
granite(){const R=blobR(1,.16,1.2);return rockMesh({R,scale:[1.2,.86,1],mat:{roughness:.5,clearcoat:.15},color:(x,y,z)=>{
  const n1=N(x*8+3,y*8,z*8),n2=N(x*21,y*21+5,z*21),k=grain(x,y,z,40,.08);
  if(n2>.3)return shade(tmp.copy(P.blk),k);if(n1>.1)return shade(mixc(P.pink,P.pink2,N(x*30,y*30,z*30)+.5),k);
  if(n1<-.2)return shade(tmp.copy(P.qtz),k);return shade(tmp.copy(P.wht),k)}})},
basalt(){const f=facetR(3,16,.78,.95,.05),R=(x,y,z)=>{const n=N(x*7+2,y*7,z*7);return f(x,y,z)-Math.max(0,n-.42)*.5};
  return rockMesh({R,scale:[1.15,.85,1],mat:{roughness:.88},color:(x,y,z,a,b,c)=>{const n=N(a*7+2,b*7,c*7);
    if(n>.42)return tmp.copy(P.obs);return shade(mixc(P.bas,P.bas2,fbm(x*3,y*3,z*3)+.5),grain(x,y,z,50,.1))}})},
obsidian(){const f=facetR(5,12,.68,1),R=(x,y,z)=>f(x,y,z)+.007*Math.sin((x*.6+y*.3+z*.74)*26+N(x*2,y*2,z*2)*4);
  return rockMesh({R,scale:[1.2,.8,1],mat:{roughness:.05,metalness:.1,clearcoat:1,clearcoatRoughness:.03},color:(x,y,z)=>mixc(P.obs,P.obs2,fbm(x*2,y*2,z*2)+.3)})},
pumice(){const b=blobR(4,.14,1.5),R=(x,y,z)=>{const n=N(x*10,y*10+4,z*10);return b(x,y,z)-Math.max(0,n-.2)*.35};
  return rockMesh({R,scale:[1.2,.88,1],mat:{roughness:.97},color:(x,y,z,a,b2,c)=>{const n=N(a*10,b2*10+4,c*10);
    return n>.2?mixc(P.pum2,P.obs,(n-.2)*2.2):shade(tmp.copy(P.pum),grain(x,y,z,35,.08))}})},
conglomerate(){const R=blobR(6,.1,1.1),g=new THREE.Group(),sc=[1.2,.85,1];
  const base=rockMesh({R,scale:sc,mat:{roughness:.95},color:(x,y,z)=>shade(mixc(P.mat,P.mat2,N(x*25,y*25,z*25)+.5),grain(x,y,z,60,.12))});g.add(base);
  const cols=['#ddd6ca','#8b9095','#7a4a3a','#3e4146','#c9a27a','#ebe5da','#a35d3f'],r=rng(9);
  fib(46,3).forEach((d,i)=>{const s=.08+r()*.12,hex=C(cols[i%cols.length]);
    const pb=rockMesh({detail:7,R:blobR(i*1.7,.1,1.4),scale:[s*1.25,s*.9,s],mat:{roughness:.45,clearcoat:.2},color:(x,y,z)=>shade(tmp.copy(hex),grain(x,y,z,12,.12))});
    pb.position.copy(base.userData.surf([d.x,d.y,d.z]).multiplyScalar(.95));pb.rotation.set(r()*3,r()*3,r()*3);g.add(pb)});
  g.userData.surf=base.userData.surf;return g},
sandstone(){const f=facetR(8,10,.84,.96,.05);return rockMesh({R:f,scale:[1.3,.8,.95],mat:{roughness:.97},color:(x,y,z)=>{
  const t=y*6+fbm(x*2,y*2,z*2)*1.3,s=Math.sin(t*PI);
  const c=s>.3?mixc(P.sand1,P.sand3,(s-.3)*1.5):mixc(P.sand1,P.sand2,-s*.9+.2);return shade(c,grain(x,y,z,70,.07))}})},
shale(){const f=facetR(10,12,.85,.98,.04),R=(x,y,z)=>f(x,y,z)+.02*Math.sign(Math.sin(y*48));
  return rockMesh({R,scale:[1.35,.46,1.05],mat:{roughness:.85},color:(x,y,z)=>shade(mixc(P.sh1,P.sh2,(Math.sin(y*90+N(x*3,y*3,z*3)*3)+1)/2),grain(x,y,z,40,.05))})},
rocksalt(){const g=new THREE.Group(),r=rng(12),cols=['#f3eee6','#efd8d1','#f6f3ee','#e9d3c9'];
  for(let i=0;i<16;i++){const s=.28+r()*.38,m=new THREE.Mesh(new THREE.BoxGeometry(s,s,s),glassy(cols[i%4],.88));
    const a=r()*TAU,rad=Math.sqrt(r())*.75;m.position.set(Math.cos(a)*rad*1.1,(r()-.5)*.7-Math.abs(rad)*.2,Math.sin(a)*rad*.8);
    m.rotation.set((r()-.5)*.6,r()*1.5,(r()-.5)*.6);g.add(m)}return g},
limestone(){const R=blobR(13,.12,1.1),g=new THREE.Group(),sc=[1.25,.85,1];
  const base=rockMesh({R,scale:sc,mat:{roughness:.92},color:(x,y,z)=>shade(mixc(P.lime,P.lime2,fbm(x*4,y*4,z*4)+.5),grain(x,y,z,45,.07))});g.add(base);

let cycle=null;
function buildCycle(){const g=new THREE.Group(),r=rng(31);
  const pos={mag:[0,-1.45],ign:[1.6,-.3],sedi:[.98,1.3],sed:[-.98,1.3],met:[-1.6,-.3]};
  const node=(m,[x,y],s)=>{m.scale.setScalar(s);m.position.set(x,y,0);g.add(m);return m};
  const magma=new THREE.Mesh(new THREE.IcosahedronGeometry(1,5),new THREE.MeshStandardMaterial({color:'#7a1d06',emissive:'#ff5a1f',emissiveIntensity:1.4,roughness:.6}));
  node(magma,pos.mag,.4);const pl=new THREE.PointLight('#ff7a30',3,4);pl.position.set(0,-1.2,.6);g.add(pl);
  node(B.granite(),pos.ign,.36);node(B.sandstone(),pos.sed,.36);node(B.gneiss(),pos.met,.36);
  const im=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(.05,1),new THREE.MeshStandardMaterial({roughness:.9}),90),mm=new THREE.Matrix4(),cl=new THREE.Color();
  for(let i=0;i<90;i++){const a=r()*TAU,h=r(),rad=(1-h)*.42*Math.sqrt(r());mm.makeTranslation(Math.cos(a)*rad,h*.32-.18,Math.sin(a)*rad*.6);im.setMatrixAt(i,mm);im.setColorAt(i,cl.set(['#d8a46a','#9a8b7c','#c9b49a','#6e6158'][i%4]))}
  im.position.set(pos.sedi[0],pos.sedi[1],0);g.add(im);
  const V=k=>new THREE.Vector3(pos[k][0],pos[k][1],0);
  const arrow=(a,b,ctl)=>{const A=V(a),Bv=V(b),dir=Bv.clone().sub(A).normalize();A.addScaledVector(dir,.5);Bv.addScaledVector(dir,-.52);
    const c=ctl?new THREE.Vector3(...ctl,0):A.clone().add(Bv).multiplyScalar(.5).multiplyScalar(1.38);
    const curve=new THREE.QuadraticBezierCurve3(A,c,Bv),mat=new THREE.MeshStandardMaterial({color:'#6d8aa0',transparent:true,opacity:.45,emissive:'#000000'});
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,40,.035,8),mat),tip=new THREE.Mesh(new THREE.ConeGeometry(.09,.22,12),mat);
    tip.position.copy(Bv);tip.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),curve.getTangent(1));g.add(tube,tip);return{curve,mat}};
  const arrows=[arrow('mag','ign'),arrow('ign','sedi'),arrow('sedi','sed'),arrow('sed','met'),arrow('met','mag'),arrow('ign','met',[0,-.15]),arrow('met','sedi',[.05,.55])];
  const dot=new THREE.Mesh(new THREE.SphereGeometry(.07,16,12),new THREE.MeshBasicMaterial({color:'#fff3c4'}));g.add(dot);
  const names=[['الصهارة','mag',-.55],['صخر ناري','ign',-.5],['رواسب','sedi',.45],['صخر رسوبي','sed',.5],['صخر متحول','met',-.5]].map(([t,k,dy])=>({t,p:[pos[k][0],pos[k][1]+dy,0]}));
  const proc=['تبريد وتصلب','تجوية وتعرية','ترسيب وتراص','حرارة وضغط','انصهار','حرارة وضغط','تجوية وتعرية'];
  g.userData={arrows,dot,magma,names,proc};return g}

function newRound(){S.quiz={n:0,score:0,used:new Set()};nextQ()}
function nextQ(){const Q=S.quiz;if(Q.n>=QN){return finish()}Q.n++;Q.done=false;Q.final=false;
  const type=pick(['name','name','fam','fam','cycle','concept','concept','mineral']);let title,ans,opts,k,why;
  if(type==='name'||type==='fam'){const r=pick(ROCKS);k=r.k;
    if(type==='name'){title='ما اسم هذه الصخرة؟';ans=r.n;opts=[ans,...shuffle(ROCKS.filter(x=>x.n!==ans).map(x=>x.n)).slice(0,3)]}
    else{title=`إلى أي نوع من الصخور ينتمي ${r.n}؟`;ans=r.fam;opts=[IGN,SED,MET]}
    why=`${r.n}: ${r.tag}. ${r.d}`}
  else if(type==='mineral'){const m=pick(MINS);k=m.k;title='ما اسم هذا المعدن؟';ans=m.n;opts=[ans,...shuffle(MINS.filter(x=>x.n!==ans).map(x=>x.n)).slice(0,3)];why=m.d}
  else if(type==='cycle'){const i=Math.floor(Math.random()*5),it=TOPICS[3].items[i];title='ما العملية التي يشير إليها السهم المضيء في دورة الصخور؟';ans=it.t;
    opts=[ans,...shuffle(TOPICS[3].items.slice(0,5).filter(x=>x.t!==ans).map(x=>x.t)).slice(0,3)];why=it.d;Q.cyc=i}
  else{let c;do c=pick(CONCEPT);while(Q.used.has(c.q)&&Q.used.size<CONCEPT.length);Q.used.add(c.q);title=c.q;ans=c.a;opts=[ans,...c.w];k=c.k;why=''}
  if(type==='cycle')go(3,Q.cyc);else{const [t,i]=findIdx(k);go(t,i)}
  Object.assign(Q,{type,ans,why,hideName:type!=='concept'});
  $('qTitle').textContent=title;$('why').textContent='';$('final').hidden=true;
  const o=$('opts');o.innerHTML='';o.hidden=false;
  shuffle(opts).forEach(n=>{const b=document.createElement('button');b.className='opt';b.type='button';b.textContent=n;b.onclick=()=>answer(b,n);o.appendChild(b)});
  $('qNum').textContent=`السؤال ${Q.n} من ${QN}`;$('score').textContent=`النتيجة: ${Q.score}`;$('qBar').style.width=((Q.n-1)/QN*100)+'%';
  $('next').textContent=Q.n<QN?'السؤال التالي ←':'النتيجة ←';$('quizBtn').textContent='إنهاء الاختبار';render()}
function answer(b,n){const Q=S.quiz;if(Q.done)return;Q.done=true;const ok=n===Q.ans;if(ok)Q.score++;
  [...$('opts').children].forEach(x=>{if(x.textContent===Q.ans)x.classList.add('ok')});if(!ok)b.classList.add('no');
  $('qTitle').textContent=ok?'إجابة صحيحة، أحسنتِ ⭐':'الإجابة الصحيحة: '+Q.ans;Q.hideName=false;
  $('why').textContent=Q.why;$('score').textContent=`النتيجة: ${Q.score}`;$('qBar').style.width=(Q.n/QN*100)+'%'}
function finish(){const Q=S.quiz;Q.final=true;Q.done=true;$('opts').hidden=true;$('why').textContent='';$('final').hidden=false;
  $('qTitle').textContent='انتهى الاختبار';$('finalScore').textContent=`${Q.score} / ${QN}`;
  $('finalMsg').textContent=Q.score>=9?'ممتاز! أنتِ نجمة الصخور ⭐':Q.score>=7?'أحسنتِ، أداء رائع':Q.score>=5?'جيد، راجعي البطاقات وحاولي مرة أخرى':'راجعي أنواع الصخور ثم أعيدي المحاولة';

  if(ptr.size===1){S.ry+=(e.clientX-px)*.012;S.rx=clamp(S.rx+(e.clientY-py)*.01,-1.2,1.2)}
  else if(ptr.size===2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)S.zoom=clamp(S.zoom*d/pinch,.5,2.6);pinch=d}});
const up=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=0};
gl.addEventListener('pointerup',up);gl.addEventListener('pointercancel',up);
gl.addEventListener('wheel',e=>{e.preventDefault();S.zoom=clamp(S.zoom*(e.deltaY<0?1.08:.93),.5,2.6)},{passive:false});
const hint=$('hint');function hideHint(){hint.style.opacity=0}setTimeout(hideHint,6000);

/* ---------- layout ---------- */
let W=0,H=0,DPR=1,FR={x:0,y:0,w:1,h:1};
const side=matchMedia('(orientation: landscape) and (min-width: 640px)');
function layout(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);lb.width=W*DPR;lb.height=H*DPR;
  const topB=$('top').getBoundingClientRect().bottom,pr=$('panel').getBoundingClientRect();
  FR=side.matches?{x:0,y:topB,w:Math.max(160,pr.left),h:H-topB}:{x:0,y:topB,w:W,h:Math.max(160,pr.top-topB)};
  cam.aspect=W/H;cam.setViewOffset(W,H,W/2-(FR.x+FR.w/2),H/2-(FR.y+FR.h/2),W,H);cam.updateProjectionMatrix();
  hint.style.top=FR.y+'px';hint.style.left=(FR.x+FR.w/2)+'px'}
addEventListener('resize',layout);side.addEventListener?.('change',layout);new ResizeObserver(layout).observe($('panel'));

/* ---------- labels ---------- */
function pill(t,x,y,c,on=true){g2.font='600 13px "IBM Plex Sans Arabic",system-ui,sans-serif';g2.direction='rtl';g2.textAlign='center';g2.textBaseline='middle';
  const w=g2.measureText(t).width+18;x=clamp(x,FR.x+w/2+6,FR.x+FR.w-w/2-6);y=clamp(y,FR.y+14,FR.y+FR.h-14);
  g2.fillStyle=on?'rgba(8,15,28,.86)':'rgba(8,15,28,.55)';g2.fillRect(x-w/2,y-12,w,24);
  g2.strokeStyle=c||'rgba(62,230,200,.6)';g2.lineWidth=1;g2.strokeRect(x-w/2,y-12,w,24);g2.fillStyle=on?'#eaf3ff':'rgba(234,243,255,.55)';g2.fillText(t,x,y+1);return[x,y]}
const v3=new THREE.Vector3(),camDir=new THREE.Vector3();
function toScreen(v){v.project(cam);return[(v.x+1)/2*W,(1-v.y)/2*H]}
function drawLabels(){g2.setTransform(DPR,0,0,DPR,0,0);g2.clearRect(0,0,W,H);
  const tp=TOPICS[S.topic],it=tp.items[S.item],Q=S.quiz;
  if(tp.cycle){const u=cycle.userData;
    u.names.forEach(n=>{const [x,y]=toScreen(cycle.localToWorld(v3.set(...n.p)));pill(n.t,x,y,'rgba(150,200,255,.5)')});
    if(!(Q&&Q.hideName))S.cycA.forEach(i=>{const p=u.arrows[i].curve.getPoint(.5);const [x,y]=toScreen(cycle.localToWorld(v3.copy(p)));pill(u.proc[i],x,y,'#ffc247')});
    return}
  if(!S.labels||Q)return;
  const [cx,cy]=toScreen(current.localToWorld(v3.set(0,0,0)));
  (it.L||[]).forEach(l=>{const loc=Array.isArray(l)?(current.userData.surf?current.userData.surf(l[0]):new THREE.Vector3(...l[0])):new THREE.Vector3(...l.p);
    const t=Array.isArray(l)?l[1]:l.t,w=current.localToWorld(loc.clone()),[ax,ay]=toScreen(w.clone());
    const facing=w.clone().sub(current.localToWorld(v3.set(0,0,0))).dot(camDir.copy(cam.position).sub(w))>-.2;
    let dx=ax-cx,dy=ay-cy,d=Math.hypot(dx,dy)||1;const lx=ax+dx/d*60,ly=ay+dy/d*44;
    g2.strokeStyle=facing?'rgba(255,255,255,.75)':'rgba(255,255,255,.25)';g2.lineWidth=1.2;
    const [px,py]=pill(t,lx,ly,null,facing);g2.beginPath();g2.moveTo(ax,ay);g2.lineTo(px,py);g2.stroke();
    g2.fillStyle=facing?'#fff':'rgba(255,255,255,.4)';g2.beginPath();g2.arc(ax,ay,3,0,TAU);g2.fill();pill(t,lx,ly,null,facing)})}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(64,now-last)/1000;last=now;S.T+=dt;
  const tp=TOPICS[S.topic];
  if(S.playing&&!tp.cycle&&!ptr.size)S.ry+=dt*.45;
  spin.rotation.set(S.rx,S.ry,0);
  const dist=cam.position.length(),ppu=(H/2)/(dist*Math.tan(cam.fov*PI/360)),fit=.42*Math.min(FR.w,FR.h)/(1.25*ppu);
  root.scale.setScalar(fit*S.zoom*(tp.cycle?.6:1));
  if(tp.cycle&&cycle){const u=cycle.userData;if(S.playing)S.cycT=(S.cycT+dt*.45)%1;
    u.arrows.forEach((a,i)=>{const on=S.cycA.includes(i);a.mat.color.set(on?'#ffc247':'#6d8aa0');a.mat.emissive.set(on?'#6a4500':'#000');a.mat.opacity=on?1:.35});
    u.dot.position.copy(u.arrows[S.cycA[0]].curve.getPoint(S.cycT));u.magma.material.emissiveIntensity=1.1+.4*Math.sin(S.T*3);
    if(!S.playing)S.ry*=.9;}
  renderer.render(scene,cam);drawLabels();requestAnimationFrame(frame)}
layout();go(0,0);requestAnimationFrame(frame);
document.fonts?.ready.then(layout);
if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)$('camBtn').click();
</script>

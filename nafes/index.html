<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منصة نجمات نافس</title>
<meta name="description" content="منصة تدريب نافس للعلوم · الثالث المتوسط · المتوسطة الأولى بصخيبرة">
<link rel="icon" href="img/moe.png">
<style>
@font-face{font-family:"Almarai";src:url(fonts/almarai.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Almarai";src:url(fonts/almarai-bold.ttf) format("truetype");font-weight:700 800;font-display:swap}
/* لوحة: أخضر الوزارة مع كحلي، وأرضية ورقية فاتحة */
:root{
  --bg:#f2f6f4;--card:#fff;--ink:#16303a;--muted:#5d7176;--line:#d9e3e0;
  --teal:#0f8a7a;--teal-soft:#dff2ee;--navy:#1f3b73;--navy-soft:#e3e9f6;
  --gold:#b7791f;--gold-soft:#fbf0dc;--ok:#1f8a4c;--ok-soft:#e1f4e8;--bad:#c0392b;--bad-soft:#fbe5e2;
  --lock:#9aa8ab;
  --f:"Almarai",Tahoma,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.7;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:1040px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.off{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:3px solid var(--teal);padding-bottom:10px}
header.off .lines{font-weight:700;font-size:13.5px;line-height:1.75}
header.off img{height:62px;width:auto}
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
.btn{border:0;background:var(--teal);color:#fff;font-weight:800;font-size:16px;padding:12px 22px;border-radius:12px}
.btn.navy{background:var(--navy)}
.btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.muted{color:var(--muted)}
.err{color:var(--bad);font-weight:700;min-height:1.6em;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
[hidden]{display:none!important}

/* البداية */
.hero{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:end;margin-top:22px}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:800}
.hero h1 span{color:var(--teal)}
.hero p{margin:8px 0 0;max-width:56ch}
.hero .mascot{width:100%;max-width:220px;justify-self:center}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.role{display:flex;flex-direction:column;gap:12px}
.role h2{font-size:20px}
.role.t h2{color:var(--navy)}

/* خريطة المجالات */
.me{display:flex;align-items:center;gap:14px;margin:20px 0 6px}
.me img{width:70px;height:auto}
.me h2{font-size:22px}
.path{display:grid;gap:12px;margin-top:14px}
.dom{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.dom .n{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--bg);color:var(--lock)}
.dom h3{font-size:18px}
.dom .st{font-size:13.5px;color:var(--muted)}
.dom.open{border-color:var(--teal)}
.dom.open .n{background:var(--teal);color:#fff}
.dom.done{border-color:var(--ok);background:linear-gradient(0deg,var(--card),var(--card))}
.dom.done .n{background:var(--ok);color:#fff}
.dom.lock{opacity:.6}
.meter{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:6px;max-width:260px}
.meter i{display:block;height:100%;background:var(--teal)}

/* الاختبار */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.qtop .tag{font-weight:800;color:var(--teal)}
.prog{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.qimg{position:relative;overflow:hidden;width:100%;border-radius:12px;background:#fff;border:1px solid var(--line)}
.qimg img{position:absolute;max-width:none;height:auto}
.ans{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.ans button{font-weight:800;font-size:24px;border:2px solid var(--line);background:#fff;color:var(--ink);padding:10px 0;border-radius:14px}
.ans button.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.ans button.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.ans button:disabled{cursor:default}
.fb{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start;margin-top:14px;border-radius:14px;padding:12px 14px}
.fb img{width:76px;height:auto}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--gold-soft)}
.fb b{display:block;font-size:17px}
.fb.ok b{color:var(--ok)}
.fb.no b{color:var(--bad)}
.fb p{margin:4px 0 0;font-size:15px}

/* النتيجة والتقييم الذاتي */
.big{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.res{display:grid;grid-template-columns:140px 1fr;gap:18px;align-items:center}
.res img{width:140px;height:auto}
.weak{display:grid;gap:8px;margin-top:10px}
.weak div{background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:14.5px}
.weak b{color:var(--gold)}
.selfl{display:grid;gap:8px;margin-top:12px}
.selfr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:10px 12px}
.seg{display:flex;gap:6px}
.seg button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--ink)}
.seg button[aria-pressed="true"].y{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"].n{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

/* المعلمة */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tabs button{border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:700;padding:8px 16px;border-radius:999px}
.tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile b{display:block;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)}
.tile span{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12.5px;color:var(--muted);background:var(--bg)}
td.c{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
td.c.ok{background:var(--ok-soft);color:var(--ok)}
td.c.mid{background:var(--gold-soft);color:var(--gold)}
td.c.no{background:var(--bad-soft);color:var(--bad)}
td.c.lk{color:var(--lock);font-weight:400}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--navy-soft)}
.bars{display:grid;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 52px;gap:10px;align-items:center;font-size:14px}
.bar .t{height:12px;background:var(--bg);border-radius:999px;overflow:hidden}
.bar .t i{display:block;height:100%;border-radius:999px;background:var(--ok)}
.bar .t i.lo{background:var(--bad)}
.bar .t i.mid{background:var(--gold)}
.bar b{font-variant-numeric:tabular-nums;text-align:left}
.flag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-inline-start:6px}
.flag.red{background:var(--bad-soft);color:var(--bad)}
.flag.gold{background:var(--gold-soft);color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--navy-soft);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.chips button{border:0;background:none;color:var(--bad);font-weight:800;padding:0 4px}
footer{margin-top:30px;text-align:center;font-size:12.5px;color:var(--muted)}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .hero .mascot{max-width:150px;order:-1}
  .roles,.grid2{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .res{grid-template-columns:1fr}
  .res img{width:100px}
  header.off img{height:48px}
  header.off .lines{font-size:12px}
  .bar{grid-template-columns:110px 1fr 44px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="off">
    <div class="lines">المملكة العربية السعودية<br>وزارة التعليم<br>إدارة التعليم بمنطقة المدينة المنورة<br>الابتدائية والمتوسطة الأولى بصخيبرة</div>
    <img src="img/moe.png" alt="شعار وزارة التعليم">
  </header>
  <main id="app"></main>
  <footer>إعداد: د. أفنان الطلحي · بنك الأسئلة: أ. هند صلوي</footer>
</div>
<script src="config.js"></script>
<script src="bank.js"></script>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>الواقع المعزز 📱 طبقي الصحي</title>
<link rel="stylesheet" href="assets/common.css">
<link rel="stylesheet" href="assets/ar.css">
<script src="assets/common.js"></script><script src="assets/food.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
/* ===== نسخة طفولية ===== */
body{font-family:Almarai,system-ui}
.arbar{background:linear-gradient(90deg,#FF7EB3,#FFB86B,#7ED6A5)!important;border-bottom:4px dashed #fff;border-radius:0 0 22px 22px}
.arbar b{font-size:16px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.artabs button{border:3px solid #fff!important;font-size:15px!important;background:#FFF0F7!important;color:#C2185B!important;transform:rotate(-1deg)}
.artabs button:nth-child(2){transform:rotate(1.5deg)}
.artabs button.on{background:linear-gradient(135deg,#FF6FA5,#FFB347)!important;color:#fff!important;animation:wig 1.2s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-2deg) scale(1.04)}50%{transform:rotate(2deg) scale(1.08)}}
.chips button{background:#fff!important;color:#6B2149!important;border:3px solid #FFC1DA!important;font-size:14.5px!important;border-radius:22px!important;box-shadow:0 4px 0 #FFC1DA}
.chips button.on{background:#FFE14D!important;border-color:#FFB300!important;box-shadow:0 4px 0 #E09A00;transform:translateY(-2px)}
.tools button{background:linear-gradient(#fff,#FFE6F1)!important;border:3px solid #FF9EC4!important;font-size:21px}
.arcard{border:4px dashed #FF8FB8!important;background:#FFFDF7!important;border-radius:28px!important;padding-right:96px!important;min-height:120px}
.arcard h3{font-size:18px!important;color:#D81B60!important}
.arcard p{font-size:15.5px!important}
.arcard .act button{border-radius:22px!important;font-size:16px!important;background:linear-gradient(#4FC3F7,#0288D1)!important;box-shadow:0 4px 0 #01579B!important}
.quiz{background:#FFF3C4!important;border-radius:20px!important;border:3px solid #FFD54F}
.quiz button{border-radius:18px!important;font-size:15px!important;border-color:#FFD54F!important}
.guide{position:fixed;z-index:7;right:calc(50% - 280px + 4px);bottom:8px;width:92px;pointer-events:none;transition:transform .4s}
@media(max-width:600px){.guide{right:6px}}
.guide img{width:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bubble{position:fixed;z-index:7;right:12px;bottom:calc(min(42vh,300px) + 22px);max-width:250px;background:#fff;border:3px solid #FF8FB8;border-radius:20px 20px 4px 20px;padding:8px 12px;font-weight:800;font-size:14.5px;color:#6B2149;box-shadow:0 6px 16px rgba(0,0,0,.2);opacity:0;transform:scale(.6);transition:.35s}
.bubble.show{opacity:1;transform:scale(1)}
.floaty{position:fixed;z-index:3;font-size:30px;pointer-events:none;animation:floatUp linear forwards}
@keyframes floatUp{from{transform:translateY(0) rotate(0)}to{transform:translateY(-110vh) rotate(360deg);opacity:.2}}
.splash{background:radial-gradient(circle at 50% 30%,#FFD1E3,#FF8FB8 45%,#B388FF)!important}
.splash h1{font-size:30px!important;text-shadow:0 3px 0 #C2185B}
.splash .btn{background:#FFE14D!important;color:#6B2149!important;border-radius:30px!important;box-shadow:0 5px 0 #E09A00!important}
</style>
</head>
<body>
<video id="cam" autoplay muted playsinline></video>
<div id="nocam"><div>📷 اسمحي للمتصفح باستخدام الكاميرا لتري الطعام فوق طاولتك!<br><button class="btn g" style="margin-top:8px" onclick="retryCam()">تفعيل الكاميرا</button></div></div>
<canvas id="gl"></canvas>
<div id="flash" class="flash"></div>
<div class="arbar"><img src="assets/img/logo.webp" alt=""><b>الواقع المعزز 📱 طبقي الصحي<small>المهارات الحياتية والأسرية • خامس ابتدائي • أ. رانيا المصري</small></b><a href="index.html">⌂</a></div>
<div class="artabs" id="artabs"></div>
<div class="chips" id="chips"></div>
<div class="tools"><button onclick="zoomBy(1.15)">＋</button><button onclick="zoomBy(.87)">－</button><button onclick="toggleSpin()">⟳</button><button onclick="flipCam()">🔄</button><button onclick="snap()">📸</button></div>
<div class="arcard" id="arcard"></div>
<div class="guide" id="guide"><img id="gimg" src="assets/img/p_wave.webp" alt=""></div><div class="bubble" id="bubble"></div>
<div class="splash" id="splash" style="background:radial-gradient(circle,#D94F86,#6B2149)" onclick="this.style.opacity=0;setTimeout(()=>this.remove(),500);ac();SFX.win()"><img src="assets/img/p_wave.webp" style="height:190px"><h1>أهلًا! أنا ريم 👋<br>تعالي نلعب بطبقنا الصحي 🍎</h1><p>وجّهي الكاميرا إلى طاولتك…<br>اسحبي بإصبعك للتدوير، وقرّبي بإصبعين للتكبير 🤏</p><button class="btn g" style="margin-top:14px;font-size:18px">ابدئي ▶</button></div>
<script type="module">
import {THREE,root,label,glow,setUpdater,clock} from './assets/arcore.js';
import {arUI} from './assets/arui.js';
const M=(c,o={})=>new THREE.MeshPhysicalMaterial({color:c,roughness:.45,clearcoat:.4,...o});
let apple=function(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(.8,32,24),M(0xd8282a,{clearcoat:1,roughness:.25}));b.scale.y=.9;g.add(b);const s=new THREE.Mesh(new THREE.CylinderGeometry(.05,.06,.45),M(0x6b4423));s.position.y=.85;g.add(s);const l=new THREE.Mesh(new THREE.SphereGeometry(.22,16,8),M(0x3fae49));l.scale.set(1.4,.35,.8);l.position.set(.25,.95,0);l.rotation.z=-.5;g.add(l);return g}
let egg=function(){const g=new THREE.Group();const e=new THREE.Mesh(new THREE.SphereGeometry(.6,32,24),M(0xf3e2c9,{roughness:.6}));e.scale.set(.85,1.15,.85);g.add(e);return g}
let bread=function(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(1.7,.9,1),M(0xc98a45,{roughness:.8}));g.add(b);const t=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,1.7,24,1,false,0,Math.PI),M(0xa86a2c,{roughness:.8}));t.rotation.z=Math.PI/2;t.position.y=.45;g.add(t);return g}
let waterGlass=function(){const g=new THREE.Group();const gl=new THREE.Mesh(new THREE.CylinderGeometry(.55,.45,1.6,32,1,true),new THREE.MeshPhysicalMaterial({color:0xffffff,transmission:.9,roughness:.05,transparent:true,opacity:.35,side:THREE.DoubleSide}));g.add(gl);const w=new THREE.Mesh(new THREE.CylinderGeometry(.5,.43,1.2,32),new THREE.MeshPhysicalMaterial({color:0x29b6f6,transparent:true,opacity:.75,roughness:.1}));w.position.y=-.18;w.name='water';g.add(w);return g}
let carrot=function(){const g=new THREE.Group();const c=new THREE.Mesh(new THREE.ConeGeometry(.35,1.8,24),M(0xf07b1d));c.rotation.z=Math.PI;g.add(c);for(let i=0;i<3;i++){const l=new THREE.Mesh(new THREE.ConeGeometry(.08,.6,8),M(0x3fae49));l.position.set((i-1)*.12,1.15,0);l.rotation.z=(i-1)*.35;g.add(l)}return g}
let drum=function(){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.SphereGeometry(.6,24,16),M(0xb8682e,{roughness:.6}));m.scale.set(1.3,.85,.85);g.add(m);const bn=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.8),M(0xf5efe0));bn.rotation.z=Math.PI/2;bn.position.x=-1.0;g.add(bn);const k=new THREE.Mesh(new THREE.SphereGeometry(.16,12,8),M(0xf5efe0));k.position.x=-1.4;g.add(k);return g}
let oil=function(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(.45,.5,1.4,24),new THREE.MeshPhysicalMaterial({color:0xd4c24a,transmission:.5,transparent:true,opacity:.85,roughness:.1}));g.add(b);const n=new THREE.Mesh(new THREE.CylinderGeometry(.15,.3,.5,16),M(0xd4c24a,{transparent:true,opacity:.85}));n.position.y=.95;g.add(n);const c=new THREE.Mesh(new THREE.CylinderGeometry(.14,.14,.25,12),M(0x9c6b3c));c.position.y=1.3;g.add(c);return g}
let rice=function(){const g=new THREE.Group();const bw=new THREE.Mesh(new THREE.SphereGeometry(.8,32,16,0,Math.PI*2,Math.PI/2,Math.PI/2),M(0x4b9fd6,{side:THREE.DoubleSide}));g.add(bw);const r=new THREE.Mesh(new THREE.SphereGeometry(.75,24,12,0,Math.PI*2,0,Math.PI/2),M(0xfafaf2,{roughness:.9}));r.scale.y=.5;g.add(r);return g}
let ITEMS=[['apple','🍎 التفاح','V',apple],['carrot','🥕 الجزر','V',carrot],['egg','🥚 البيض','P',egg],['drum','🍗 الدجاج','P',drum],['bread','🍞 الخبز','C',bread],['rice','🍚 الأرز','C',rice],['oil','🫒 الزيت','F',oil],['water','💧 الماء','W',waterGlass]];
function plateDisk(){const g=new THREE.Group();const p=new THREE.Mesh(new THREE.CylinderGeometry(4,3.6,.25,64),M(0xffffff,{roughness:.3,clearcoat:1}));g.add(p);const cols=[0xf2a541,0x2f8fd6,0x4caf50,0xe23b3b];for(let i=0;i<4;i++){const q=new THREE.Mesh(new THREE.CylinderGeometry(3.5,3.5,.05,32,1,false,i*Math.PI/2,Math.PI/2),new THREE.MeshPhysicalMaterial({color:cols[i],transparent:true,opacity:.55}));q.position.y=.15;g.add(q)}return g}
function face(o,r,y=0,z=null){const g=new THREE.Group();const em=new THREE.MeshBasicMaterial({color:0x2b1b1b}),wm=new THREE.MeshBasicMaterial({color:0xffffff}),pm=new THREE.MeshBasicMaterial({color:0xff7aa8});
 const zz=z??r*.98;for(const sx of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(r*.13,12,8),em);e.position.set(sx*r*.3,y+r*.12,zz);g.add(e);const h=new THREE.Mesh(new THREE.SphereGeometry(r*.045,8,6),wm);h.position.set(sx*r*.3+r*.04,y+r*.18,zz+r*.1);g.add(h);const c=new THREE.Mesh(new THREE.SphereGeometry(r*.11,10,6),pm);c.scale.z=.3;c.position.set(sx*r*.52,y-r*.08,zz-r*.08);g.add(c)}
 const m=new THREE.Mesh(new THREE.TorusGeometry(r*.17,r*.035,8,16,Math.PI),em);m.rotation.z=Math.PI;m.position.set(0,y-r*.08,zz);g.add(m);o.add(g);return o}
const _ap=apple,_eg=egg,_br=bread,_ca=carrot,_dr=drum,_ri=rice,_oi=oil,_wg=waterGlass;
apple=()=>face(_ap(),.8);egg=()=>face(_eg(),.62,.1,.52);bread=()=>face(_br(),.75,0,.52);carrot=()=>face(_ca(),.38,.4,.3);drum=()=>face(_dr(),.6,.05,.52);rice=()=>face(_ri(),.6,.1,.62);oil=()=>face(_oi(),.5,0,.5);waterGlass=()=>face(_wg(),.55,-.2,.56);
let objs={};ITEMS=ITEMS.map(x=>[x[0],x[1],x[2],{apple,carrot,egg,drum,bread,rice,oil,water:waterGlass}[x[0]]]);
const SCENES=[
{tab:'🍽 طبقي الصحي',title:'🍽 الطبق الصحي على طاولتك',text:'الطبق الصحي فيه أربع مجموعات: <b>حبوب</b> 🍞 و<b>بروتين</b> 🥚 و<b>خضار</b> 🥕 و<b>فاكهة</b> 🍎، ومعه كوب <b>ماء</b> 💧. اضغطي اسم الطعام ليقفز ويعرّفك بنفسه!',
 quiz:{q:'أي مجموعة ينتمي إليها البيض؟',o:['أطعمة البناء (البروتينات)','أطعمة الوقاية','أطعمة الطاقة'],a:0,why:'البيض غني بالبروتين الذي يبني الجسم.'},
 build(api){root.clear();objs={};const pd=plateDisk();pd.position.y=-1.2;root.add(pd);
  const pos={bread:[2,-.5,-1.5],rice:[1.5,-.6,1.6],egg:[-1.3,-.45,1.6],drum:[-1.8,-.6,-1.2],apple:[-.2,-.2,-2.2],carrot:[.2,-.7,2.5],oil:[5,0,0],water:[-5,0,0]};
  ITEMS.forEach(([k,n,t,f])=>{const o=f();o.position.set(...pos[k]);o.userData.home=o.position.clone();root.add(o);objs[k]=o});
  let sel=null,t0=0;api.chipSet(ITEMS.map(x=>x[1]),i=>{sel=ITEMS[i][0];t0=clock.t;const nt=NUT[ITEMS[i][2]];api.setText(`<b>${ITEMS[i][1]}</b> غني بـ<b style="color:${nt.c}">${nt.n} ${nt.e}</b>: ${nt.f}.`);SFX.pop()},-1);
  setUpdater((dt,t)=>{for(const k in objs){const o=objs[k];const h=o.userData.home;const up=k===sel?Math.max(0,Math.sin(Math.min(1,(t-t0)*1.5)*Math.PI))*1.6+.6:0;o.position.y=h.y+up+Math.sin(t*1.5+h.x)*.05;o.rotation.y+=dt*(k===sel?2:.3)}})}},
{tab:'🧩 كنوز الطعام',title:'🧩 كل طعام له كنز',text:'اختاري العنصر الغذائي لتقترب منك الأطعمة الغنية به ✨',
 quiz:{q:'ما المصدر الرئيس للطاقة؟',o:['الكربوهيدرات','الماء','الأملاح'],a:0,why:'الخبز والأرز والفواكه تمنحنا الطاقة.'},
 build(api){root.clear();objs={};ITEMS.forEach(([k,n,t,f],i)=>{const o=f();const a=i/ITEMS.length*Math.PI*2;o.userData.a=a;o.userData.t=t;root.add(o);objs[k]=o});
  let pick=null;const keys=Object.keys(NUT);api.chipSet(keys.map(k=>NUT[k].e+' '+NUT[k].n),i=>{pick=keys[i];const n=NUT[pick];api.setText(`<b style="color:${n.c}">${n.n} ${n.e}</b>: ${n.f}.<br>مصادره: ${ITEMS.filter(x=>x[2]===pick).map(x=>x[1]).join(' ، ')}${pick==='P'?' ، اللحوم والسمك والبقول':pick==='C'?' ، المعكرونة والعسل':pick==='F'?' ، الزبدة والمكسرات':pick==='V'?' ، الحليب (كالسيوم) والسمك (يود)':' ، العصير والحليب والفواكه'}`);api.flash();SFX.ok()},-1);
  setUpdater((dt,t)=>{for(const k in objs){const o=objs[k];const on=pick&&o.userData.t===pick;const r=on?1.6:3.6;const a=o.userData.a+t*.25;o.position.lerp(new THREE.Vector3(Math.cos(a)*r,on?.8:Math.sin(t+o.userData.a)*.3,Math.sin(a)*r),.06);const s=on?1.5:(pick?.6:1);o.scale.lerp(new THREE.Vector3(s,s,s),.08);o.rotation.y+=dt*.6}})}},
{tab:'💧 اشربي يا ريم',title:'💧 كوب الماء السحري',text:'الماء <b>ضروري لخلايا الجسم</b>. اضغطي «اشربي» لتشربي كوبًا. الهدف 8 أكواب في اليوم!',
 quiz:{q:'قلة شرب الماء تسبب…',o:['العطش والصداع والتعب','زيادة النشاط','قوة العظام'],a:0},
 build(api){root.clear();const g=waterGlass();g.scale.setScalar(2);root.add(g);const w=g.getObjectByName('water');let cups=0,lev=1;let lb=label('0 / 8 أكواب','#fff','rgba(29,95,150,.85)',1);lb.position.y=2.6;root.add(lb);
  window._drink=()=>{cups=Math.min(8,cups+1);lev=0;SFX.pop();root.remove(lb);lb=label(cups+' / 8 أكواب'+(cups===8?' 🎉':''),'#fff',cups===8?'rgba(46,158,91,.9)':'rgba(29,95,150,.85)',1);lb.position.y=2.6;root.add(lb);if(cups===8){confetti();SFX.win();api.setText('🤩 ممتاز! شربتِ 8 أكواب: جسمك مرتوٍ ونشيط، وخلاياك سعيدة 💪')}};
  setUpdater((dt,t)=>{lev=Math.min(1,lev+dt*.5);w.scale.y=Math.max(.02,lev);w.position.y=-.78+.6*lev;g.rotation.y+=dt*.3})},
 actions:[{l:'🥤 اشربي كوبًا',c:'b',f(){window._drink&&_drink()}}]}
];
const GUIDE=[['p_wave','اضغطي اسم الطعام ليقفز ويعرّفك بنفسه! 🥚🍎'],['p_present','اختاري عنصرًا… وشوفي الأطعمة تجري إليه! ✨'],['p_thumb','اشربي 8 أكواب وأنا أصفّق لك 💧👏']];
let GI=0;function guide(i){GI=i;const g=GUIDE[i]||GUIDE[0];document.getElementById('gimg').src='assets/img/'+g[0]+'.webp';const b=document.getElementById('bubble');b.classList.remove('show');setTimeout(()=>{b.textContent=g[1];b.classList.add('show')},250);clearTimeout(window._bt);window._bt=setTimeout(()=>b.classList.remove('show'),5200)}
function rain(){const E=['🍎','🥕','🥚','🍞','💧','🍊','🥛','⭐','💖'];for(let i=0;i<14;i++){const f=document.createElement('div');f.className='floaty';f.textContent=E[i%E.length];f.style.left=Math.random()*95+'vw';f.style.top='100vh';f.style.animationDuration=(3+Math.random()*3)+'s';f.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(f);setTimeout(()=>f.remove(),8000)}}
SCENES.forEach((sc,i)=>{const b=sc.build;sc.build=api=>{b(api);guide(i);const cs=api.chipSet;}});
const _cf=window.confetti;window.confetti=n=>{_cf&&_cf(n);rain();const im=document.getElementById('gimg');im.src='assets/img/p_cheer.webp';setTimeout(()=>guide(GI),2500)};
document.addEventListener('click',e=>{const b=e.target.closest('.quiz button');if(!b)return;const im=document.getElementById('gimg');setTimeout(()=>{if(b.classList.contains('bad')){im.src='assets/img/p_think.webp';const bb=document.getElementById('bubble');bb.textContent='أوووه! فكّري مرة ثانية 🤔';bb.classList.add('show')}},50)});
arUI(SCENES);setTimeout(rain,600);
</script>
</body>
</html>

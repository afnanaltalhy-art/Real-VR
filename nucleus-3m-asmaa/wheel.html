<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>عجلة الإجابة • ثالث ١ • أ. اسماء الصحفي</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Almarai,sans-serif;background:linear-gradient(160deg,#FBF6E9,#F1E6C8);color:#3B4A17;min-height:100vh}
header{background:#5A6B2B;color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
header h1{margin:0;font-size:clamp(22px,3vw,34px)}header small{font-size:15px;opacity:.9}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px}
.tabs button{border:0;color:#fff;font:800 clamp(16px,1.8vw,22px) Almarai;padding:10px 18px;cursor:pointer;opacity:.6;border-bottom:5px solid transparent}
.tabs button.on{opacity:1;border-bottom-color:#3B4A17;transform:translateY(-2px)}
main{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;padding:0 14px 20px}
.wrap{position:relative;width:min(80vh,92vw);max-width:640px}
canvas{width:100%;height:auto;display:block}
.ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:44px solid #C62828;filter:drop-shadow(0 3px 2px #0005);z-index:2}
.side{width:min(360px,92vw);display:flex;flex-direction:column;gap:12px}
.spin{font:800 30px Almarai;background:#D4A72C;color:#fff;border:0;padding:16px;cursor:pointer;box-shadow:0 5px 0 #8a6b12}
.spin:disabled{opacity:.5}
.res{background:#fff;border:3px solid #D4A72C;padding:16px;text-align:center;min-height:120px}
.res b{display:block;font-size:clamp(28px,3.5vw,42px);margin-top:6px}
label{font-size:17px;background:#fffc;padding:10px;display:flex;gap:8px;align-items:center;cursor:pointer}
.done{background:#fff9;padding:10px;font-size:15px;max-height:170px;overflow:auto}
.small{font:700 16px Almarai;background:#5A6B2B;color:#fff;border:0;padding:8px;cursor:pointer}
footer{text-align:center;padding:10px;font-size:14px;opacity:.8}
.pop{animation:pop .6s}@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
</style></head><body>
<header><h1>🎡 عجلة الإجابة: من تجيب؟</h1><small>متوسطة ١١٨ • علوم ثالث متوسط • الصف ثالث ١</small></header>
<div class="tabs" id="tabs"></div>
<main><div class="wrap"><div class="ptr"></div><canvas id="cv" width="1000" height="1000"></canvas></div>
<div class="side"><button class="spin" id="spin">🎡 دوّري العجلة</button>
<div class="res" id="res">اختاري نوع العجلة من الأعلى<br>ثم اضغطي «دوّري العجلة» 🎯</div>
<label><input type="checkbox" id="rm" checked> لا تتكرر من أُجيبت (تُحذف بعد اختيارها)</label>
<div class="done" id="done">من أجابت: —</div><button class="small" id="reset">↺ إعادة العجلة كاملة</button></div></main>
<footer>أ. اسماء الصحفي • مديرة المدرسة: مها العتيبي</footer>
<script>
const G=[{"n": "الأولى", "c": "#E2463F", "s": ["ريماس سعد السلمي", "دانة علي الساعدي", "جودي احمد القرني", "جود عبد الكريم الزهراني", "اسرار سعود المطيري", "ميان ابراهيم الكبيسي", "دارين حسين السلمي", "لمار عبد الله الحربي"]}, {"n": "الثانية", "c": "#2F6FD6", "s": ["الاء خالد العتيبي", "سارة امين السلمي", "فرح محمد الغامدي", "لمار احمد عسيري", "وريف عويض السلمي", "جمانة حمدان الكثيري", "رغد سعيد الشهري"]}, {"n": "الثالثة", "c": "#D4A72C", "s": ["العنود متعب الزهراني", "طيف احمد المنتشري", "ديالا ابراهيم الشمراني", "جوانا سعد العتيبي", "جودي عبد الله العاصمي", "غنى احمد الشهري", "سجى سالم العاصمي"]}, {"n": "الرابعة", "c": "#5A6B2B", "s": ["شذى غازي الجهني", "جيلان محمد العرياني", "ميس سعيد الزهراني", "حنان عبده جعفري", "ريم رشاد السلمي", "فجر عبد الناصر السلمي", "ريتال يحيى الزهراني"]}, {"n": "الخامسة", "c": "#8E44AD", "s": ["فجر عبد الله المالكي", "سارة مريع القحطاني", "اسمى موسى الحارثي", "سجى بدر السلمي", "جنى عادل العمري", "جنى عتيق السلمي", "رزان ناصر الاحمري", "جوري راشد الزهراني"]}];
const KINDS=[{t:'كل الطالبات',c:'#8E44AD',items:()=>G.flatMap((g,i)=>g.s.map(n=>({n,c:g.c,g:i})))}]
 .concat(G.map((g,i)=>({t:'المجموعة '+g.n,c:g.c,items:()=>g.s.map((n,k)=>({n,c:k%2?shade(g.c):g.c,g:i}))})))
 .concat([{t:'المجموعات',c:'#D4A72C',items:()=>G.map((g,i)=>({n:'المجموعة '+g.n,c:g.c,g:i}))}]);
function shade(h){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=r*.72+255*.28|0;g=g*.72+255*.28|0;b=b*.72+255*.28|0;return `rgb(${r},${g},${b})`}
const cv=document.getElementById('cv'),x=cv.getContext('2d');let kind=0,list=[],used={},rot=0,busy=false;
function load(k){kind=k;used[k]=used[k]||[];list=KINDS[k].items().filter(it=>!used[k].includes(it.n));rot=0;draw();
 document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',i==k));
 document.getElementById('done').textContent='من أجابت: '+(used[k].join('، ')||'—');
 document.getElementById('res').innerHTML='العجلة: <b style="font-size:26px">'+KINDS[k].t+'</b>';}
function draw(){const W=1000,c=W/2,r=W*.47;x.clearRect(0,0,W,W);const N=list.length;
 if(!N){x.fillStyle='#5A6B2B';x.font='800 50px Almarai';x.textAlign='center';x.fillText('انتهت الأسماء 🎉',c,c);return}
 const st=2*Math.PI/N;x.save();x.translate(c,c);x.rotate(rot);
 list.forEach((it,i)=>{const a0=-Math.PI/2+i*st;x.beginPath();x.moveTo(0,0);x.arc(0,0,r,a0,a0+st);x.closePath();x.fillStyle=it.c;x.fill();x.strokeStyle='#fff';x.lineWidth=N>20?3:6;x.stroke();
  x.save();const am=a0+st/2;x.rotate(am);let wa=((am+rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);const lf=wa>Math.PI/2&&wa<3*Math.PI/2;if(lf)x.rotate(Math.PI);x.textAlign=lf?'left':'right';x.textBaseline='middle';x.fillStyle='#fff';
  const fs=N>20?Math.min(26,st*r*.62):Math.min(44,st*r*.45);x.font=`800 ${fs}px Almarai`;x.shadowColor='#0007';x.shadowBlur=4;x.fillText(it.n,lf?-(r-18):r-18,0,r*.72);x.restore();});
 x.restore();x.beginPath();x.arc(c,c,r,0,7);x.lineWidth=16;x.strokeStyle='#D4A72C';x.stroke();
 x.beginPath();x.arc(c,c,W*.07,0,7);x.fillStyle='#FBF6E9';x.fill();x.lineWidth=8;x.stroke();}
// أصوات طبيعية بلا موسيقى: حفيف الدوران وتصفيق عند الاختيار
let AC;function noise(d,f,vol){AC=AC||new AudioContext();const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
 const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;const g=AC.createGain();g.gain.value=vol;s.connect(fl).connect(g).connect(AC.destination);s.start();}
function clap(){for(let i=0;i<10;i++)setTimeout(()=>noise(.12,1500+Math.random()*900,.9),i*90+Math.random()*50)}
function tick(){noise(.03,3000,.35)}
document.getElementById('spin').onclick=()=>{if(busy||!list.length)return;busy=true;const N=list.length,st=2*Math.PI/N;
 const pick=Math.floor(Math.random()*N);const off=(Math.random()*.7+.15)*st;
 let target=-(pick*st+off);target-=Math.ceil((rot-target)/(2*Math.PI))*2*Math.PI;target+=-(5+Math.floor(Math.random()*3))*2*Math.PI;
 const start=rot,dur=5200,t0=performance.now();let last=Math.floor(start/st);noise(1.2,600,.5);
 document.getElementById('spin').disabled=true;
 (function f(t){let p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,4);rot=start+(target-start)*e;draw();
  const cur=Math.floor(rot/st);if(cur!=last){last=cur;tick()}
  if(p<1)requestAnimationFrame(f);else{busy=false;document.getElementById('spin').disabled=false;const it=list[pick];clap();
   const r=document.getElementById('res');r.innerHTML='🎉 من تجيب:<b style="color:'+it.c+'">'+it.n+'</b>'+(kind==0?'<small>المجموعة '+G[it.g].n+'</small>':'');r.classList.remove('pop');void r.offsetWidth;r.classList.add('pop');
   if(document.getElementById('rm').checked){used[kind].push(it.n);setTimeout(()=>{list.splice(pick,1);rot=0;draw();document.getElementById('done').textContent='من أجابت: '+used[kind].join('، ')},1800)}}})(t0);};
document.getElementById('reset').onclick=()=>{used[kind]=[];load(kind)};
const tb=document.getElementById('tabs');KINDS.forEach((k,i)=>{const b=document.createElement('button');b.textContent=k.t;b.style.background=k.c;b.onclick=()=>{if(!busy)load(i)};tb.appendChild(b)});
document.fonts.ready.then(()=>load(0));load(0);
</script></body></html>

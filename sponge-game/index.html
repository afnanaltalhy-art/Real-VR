#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.card{width:min(980px,100%);max-height:100%;overflow:auto;background:rgba(255,255,255,.58);backdrop-filter:blur(1.5px);border-radius:26px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,40,60,.35);animation:pop .45s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
h1{margin:0 0 6px;color:var(--deep);font-size:clamp(24px,5vw,40px)}
h2{margin:0 0 8px;color:var(--deep);font-size:clamp(19px,3.6vw,28px)}
p{text-shadow:0 0 6px rgba(255,255,255,.9);line-height:1.8;margin:6px 0;font-size:clamp(14px,2.6vw,18px)}
.btn{font-family:inherit;font-weight:700;border:0;border-radius:40px;padding:12px 26px;font-size:clamp(15px,2.8vw,19px);color:#fff;background:var(--deep);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.l{background:var(--lilac)}.btn.s{background:var(--sponge)}.btn.c{background:var(--coral)}.btn.a{background:var(--aqua)}
.hud{width:min(980px,100%);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.pill{background:rgba(255,255,255,.75);border-radius:30px;padding:7px 14px;font-weight:700;font-size:clamp(13px,2.4vw,17px);color:var(--deep);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.depth{flex:1;height:14px;background:rgba(255,255,255,.5);border-radius:10px;overflow:hidden}
.depth i{display:block;height:100%;background:linear-gradient(90deg,#FFD866,#1FA3B1);width:0;transition:width .8s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{font-family:inherit;font-weight:700;font-size:clamp(14px,2.7vw,19px);text-align:right;background:rgba(255,255,255,.72);border:2.5px solid #CFE3E6;border-radius:18px;padding:14px;cursor:pointer;color:var(--txt);transition:.2s}
.opt:hover{border-color:var(--aqua)}
.opt.ok{background:rgba(230,242,212,.9);border-color:var(--olive)}.opt.no{background:rgba(253,228,225,.9);border-color:var(--coral);animation:shake .4s}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.fb{min-height:30px;font-weight:700;margin-top:10px;font-size:clamp(14px,2.6vw,18px)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sp{flex:1 1 300px;max-width:380px;margin:auto}
.sp .hot{cursor:pointer;transition:.2s}.sp .hot:hover{filter:brightness(1.15)}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.step{font-family:inherit;font-weight:700;background:rgba(255,255,255,.72);border:2.5px solid #CFE3E6;border-radius:40px;padding:12px 16px;text-align:right;font-size:clamp(14px,2.6vw,18px);cursor:pointer;display:flex;gap:10px;align-items:center;color:var(--txt)}
.step b{width:34px;height:34px;flex:none;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#E8D3A8);display:grid;place-items:center;color:var(--deep)}
.step.done{background:rgba(217,244,246,.85);border-color:var(--aqua)}.step.done b{background:var(--aqua);color:#fff}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.bk{border-radius:20px;padding:14px;min-height:120px;border:3px dashed;font-weight:700;cursor:pointer;text-align:center;font-size:clamp(15px,2.8vw,20px)}
.bk.x{background:rgba(217,244,246,.7);border-color:var(--aqua);color:var(--deep)}.bk.y{background:rgba(239,231,249,.7);border-color:var(--lilac);color:#5d3f8e}
.bk span{display:inline-block;margin:4px;padding:4px 10px;background:#fff;border-radius:12px;font-size:14px}
.chip{display:inline-block;font-weight:700;background:var(--spongel);border:2.5px solid var(--sponge);padding:12px 22px;border-radius:18px;font-size:clamp(18px,3.4vw,24px);animation:pop .3s}
.timer{height:10px;background:#E1EAEC;border-radius:8px;overflow:hidden;margin-top:6px}.timer i{display:block;height:100%;background:var(--sponge);width:100%}
.pearls{font-size:26px;letter-spacing:2px}
.char{width:min(260px,60vw);border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
input{font-family:inherit;font-size:18px;padding:10px 16px;border-radius:30px;border:2.5px solid var(--aqua);text-align:center;width:min(320px,90%)}
.cert{border:4px double var(--sponge);border-radius:22px;padding:16px;text-align:center;background:linear-gradient(rgba(255,253,247,.6),rgba(255,242,201,.7))}
.foot{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;font-weight:700}
.order{position:fixed;bottom:4px;left:8px;font-family:inherit;font-weight:700;font-size:12px;border:0;border-radius:20px;padding:5px 12px;background:rgba(255,255,255,.85);color:var(--deep);cursor:pointer}
#ord{display:none;position:fixed;bottom:34px;left:8px;background:#fff;border-radius:14px;padding:8px 14px;font-weight:700;color:var(--deep);box-shadow:0 4px 14px rgba(0,0,0,.25);direction:rtl}
.bubble{position:fixed;bottom:-40px;border-radius:50%;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.6);animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh)}}
.center{text-align:center}
.top{position:fixed;top:0;left:0;right:0;height:74px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px;background:rgba(255,255,255,.72);backdrop-filter:blur(2px);box-shadow:0 2px 10px rgba(0,40,60,.18);z-index:5}
.top .sch{font-weight:700;font-size:clamp(9px,1.9vw,13px);line-height:1.45;color:var(--deep);text-align:right;flex:1}
.top .tch{font-weight:700;font-size:clamp(14px,3.2vw,22px);color:#fff;background:linear-gradient(90deg,#3B86C1,#3E9A96,#4FAF74);box-shadow:0 3px 8px rgba(0,60,80,.25);padding:6px 16px;border-radius:30px;white-space:nowrap}
.top .lg{flex:1;display:flex;justify-content:flex-end}.top img{height:58px}
#app{top:78px}
</style>
</head>

const A=document.getElementById('app');
let pname="",score=0,pearls=0,level=0;
let AC=null;function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function tone(f,d,t='sine',v=.2,delay=0){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,c.currentTime+delay);g.gain.linearRampToValueAtTime(v,c.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+delay+d);o.connect(g);g.connect(c.destination);o.start(c.currentTime+delay);o.stop(c.currentTime+delay+d+.05)}
function noiseBuf(sec){const c=ac();const n=c.sampleRate*sec,bf=c.createBuffer(1,n,c.sampleRate),d=bf.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;l=(l+0.02*w)/1.02;d[i]=l*3.5}return bf}
function splash(v=.35,f=900,dur=.5){const c=ac();if(!c)return;const s=c.createBufferSource();s.buffer=noiseBuf(dur);const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=.8;const g=c.createGain();g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);s.connect(bp);bp.connect(g);g.connect(c.destination);s.start()}
function blub(delay=0,f0=300,f1=1400,v=.16){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+.09);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.12);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.15)}
let amb=null,muted=false;
function ocean(){const c=ac();if(!c||amb)return;const s=c.createBufferSource();s.buffer=noiseBuf(8);s.loop=true;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;const g=c.createGain();g.gain.value=.09;const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.12;lg.gain.value=.06;lfo.connect(lg);lg.connect(g.gain);s.connect(lp);lp.connect(g);g.connect(c.destination);s.start();lfo.start();amb=g;setInterval(()=>{if(!muted&&Math.random()<.5)for(let i=0;i<3+Math.random()*4;i++)blub(i*.07+Math.random()*.05,250+Math.random()*200,900+Math.random()*900,.05)},2600)}
function toggleMute(){muted=!muted;if(amb)amb.gain.value=muted?0:.09;document.getElementById('mt').textContent=muted?'🔇':'🌊'}
const S={ok(){if(muted)return;splash(.25,1400,.35);for(let i=0;i<6;i++)blub(i*.06,350+i*60,1500+i*150,.14)},no(){if(muted)return;splash(.4,220,.45)},pop(){if(muted)return;blub(0)},win(){if(muted)return;splash(.35,700,1.4);for(let i=0;i<16;i++)blub(i*.09,300+Math.random()*300,1200+Math.random()*1000,.12)}};
document.addEventListener('pointerdown',()=>ocean(),{once:true});
function bubbles(n=10){for(let i=0;i<n;i++){const b=document.createElement('div');b.className='bubble';const s=6+Math.random()*22;b.style.width=b.style.height=s+'px';b.style.left=Math.random()*100+'vw';b.style.animationDuration=(3+Math.random()*4)+'s';b.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(b);setTimeout(()=>b.remove(),9000)}}
function hud(){return `<div class="hud"><span class="pill">🤿 ${pname||'الغوّاصة'}</span><div class="depth"><i style="width:${level*25}%"></i></div><span class="pill">⚪ ${pearls} لؤلؤة • ${score} نقطة</span></div>`}
function view(html,withHud=true){A.innerHTML=(withHud?hud():'')+`<div class="card">${html}</div>`;requestAnimationFrame(()=>{const d=document.querySelector('.depth i');if(d)d.style.width=level*25+'%'})}
function shuffle(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}
function gain(p){score+=p;pearls++;S.ok();bubbles(8)}

/* ---------- start ---------- */
function start(){view(`<div class="row"><img class="char" src="${CHAR}"><div style="flex:1;min-width:260px">
<h1>مغامرة غوّاصة الشعاب 🤿</h1><p>انطلقي بغوّاصتك إلى أعماق الشعاب المرجانية، واجمعي اللآلئ بحلّ تحدّيات درس <b>الإسفنجيات</b>. أربع محطات تنتظرك… كلما أجبتِ غصتِ أعمق!</p>
<p><input id="nm" placeholder="اكتبي اسمك هنا"></p><p><button class="btn" onclick="pname=(document.getElementById('nm').value||'').trim()||'الغوّاصة';S.pop();intro1()">ابدئي الغوص ⬇</button></p></div></div>`,false)}

${Array.from({length:10},(_,i)=>70+i*34).map(y=>`<ellipse class="hot" data-k="collar" cx="146" cy="${y}" rx="9" ry="12" fill="#5FA85C"/><ellipse class="hot" data-k="collar" cx="274" cy="${y}" rx="9" ry="12" fill="#5FA85C"/>`).join('')}
${[[95,140],[98,300],[300,220],[305,380],[100,220]].map(([x,y])=>`<line class="hot" data-k="spic" x1="${x}" y1="${y}" x2="${x+28}" y2="${y-15}" stroke="#fff" stroke-width="8" stroke-linecap="round"/>`).join('')}
${[[112,120],[312,130],[110,360],[318,300]].map(([x,y])=>`<ellipse class="hot" data-k="amoe" cx="${x}" cy="${y}" rx="15" ry="10" fill="#B48FE0"/>`).join('')}
<rect class="hot" data-k="osc" x="150" y="0" width="120" height="30" rx="12" fill="#3FA9F5" opacity=".75"/>
</svg>`;
const L1=[["الفتحة الزفيرية","osc","يخرج منها الماء والفضلات من أعلى الإسفنج."],["الخلايا المطوّقة","collar","تبطّن التجويف، وتحرّك أسواطها لتدفع الماء وتلتقط الغذاء."],["أحد الثقوب","pore","يدخل منه الماء المحمّل بالغذاء والأكسجين."],["خلية شبه أميبية","amoe","تتحرّك في الطبقة الهلامية، تنقل الغذاء وتنتج الأمشاج والشويكات."],["شويكة","spic","تركيب إبري يدعم الجسم ويحميه."]];
let q1=0,t1=0;
function intro1(){level=0;q1=0;view(`<h2>المحطة 1: صيّادة التراكيب 🎯</h2><p>سيظهر اسم تركيب من تراكيب الإسفنج… اضغطي عليه في الرسم. لكل إجابة صحيحة من المحاولة الأولى 10 نقاط ولؤلؤة!</p><p class="center"><button class="btn a" onclick="S.pop();lv1()">هيّا!</button></p>`)}
function lv1(){t1=0;const [n,k,info]=L1[q1];view(`<div class="row"><div style="flex:1 1 260px"><h2>المحطة 1 (${q1+1}/${L1.length})</h2><p>اضغطي على:</p><p><span class="chip">${n}</span></p><div class="fb" id="fb"></div><div id="nx"></div></div>${SP}</div>`);
 document.querySelectorAll('#svg .hot').forEach(el=>el.onclick=e=>{e.stopPropagation();if(document.getElementById('nx').innerHTML)return;
  if(el.dataset.k===k){if(t1===0)gain(10);else S.ok();document.querySelectorAll(`#svg [data-k="${k}"]`).forEach(x=>x.style.filter='drop-shadow(0 0 6px #FFD866) brightness(1.2)');
   document.getElementById('fb').innerHTML=`<span style="color:var(--olive)">✓ أحسنتِ! ${info}</span>`;document.getElementById('nx').innerHTML=`<button class="btn s" onclick="S.pop();q1++;q1<L1.length?lv1():intro2()">التالي ←</button>`;document.querySelector('.hud .pill:last-child').textContent=`⚪ ${pearls} لؤلؤة • ${score} نقطة`}
  else{t1++;S.no();document.getElementById('fb').innerHTML=`<span style="color:var(--coral)">✗ ليس هذا… حاولي مرة أخرى</span>`}})}

/* ---------- level 2: order ---------- */
const L2=["يدخل الماء المحمّل بالغذاء عبر الثقوب","تحرّك الخلايا المطوّقة أسواطها فتسحب الماء إلى التجويف","تلتقط الخلايا المطوّقة دقائق الغذاء وتهضمها","تنقل الخلايا شبه الأميبية الغذاء إلى باقي الخلايا","يخرج الماء والفضلات من الفتحة الزفيرية"];
let nxt2=0,err2=0;
function intro2(){level=1;view(`<h2>المحطة 2: رحلة قطرة الماء 💧</h2><p>رتّبي مراحل رحلة الماء والغذاء داخل الإسفنج: اضغطي الخطوات بالترتيب الصحيح من الأولى إلى الأخيرة.</p><p class="center"><button class="btn a" onclick="S.pop();lv2()">انطلقي!</button></p>`);bubbles(12)}
function lv2(){nxt2=0;err2=0;const sh=shuffle(L2.map((t,i)=>[t,i]));view(`<h2>المحطة 2: رتّبي الرحلة</h2><div class="steps">${sh.map(([t,i])=>`<button class="step" data-i="${i}"><b>?</b>${t}</button>`).join('')}</div><div class="fb" id="fb"></div><div id="nx"></div>`);
 document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;if(+b.dataset.i===nxt2){b.classList.add('done');b.querySelector('b').textContent=++nxt2;S.pop();
  if(nxt2===L2.length){const p=Math.max(10,50-err2*8);score+=p-10;gain(10);document.getElementById('fb').innerHTML=`<span style="color:var(--olive)">✓ رائع! أتممتِ الرحلة (+${p} نقطة)</span>`;document.getElementById('nx').innerHTML=`<button class="btn s" onclick="S.pop();intro3()">المحطة التالية ←</button>`}}
  else{err2++;S.no();b.classList.add('no');setTimeout(()=>b.classList.remove('no'),400);document.getElementById('fb').innerHTML=`<span style="color:var(--coral)">✗ فكّري: ما الذي يحدث قبل ذلك؟</span>`}})}

/* ---------- level 3: baskets ---------- */
const L3=shuffle([["التجزّؤ",1],["التبرعم",1],["البريعمات",1],["خنثى",0],["إخصاب داخلي",0],["يرقة هدبية حرّة السباحة",0],["عاصفة تقطع جزءًا من الإسفنج",1],["الخلايا المطوّقة تنقل الحيوان المنوي",0]]);
let i3=0,ok3=0;
function intro3(){level=2;i3=0;ok3=0;view(`<h2>المحطة 3: سلّتا التكاثر 🧺</h2><p>ستظهر بطاقات… ضعي كل بطاقة في سلّتها: <b>تكاثر جنسي</b> أم <b>تكاثر لاجنسي</b>؟</p><p class="center"><button class="btn a" onclick="S.pop();lv3()">ابدئي!</button></p>`);bubbles(12)}
function lv3(){view(`<h2>المحطة 3 (${Math.min(i3+1,L3.length)}/${L3.length})</h2><p class="center"><span class="chip" id="cd">${L3[i3][0]}</span></p><div class="baskets"><div class="bk x" data-v="0">🧺 تكاثر جنسي<div id="b0"></div></div><div class="bk y" data-v="1">🧺 تكاثر لاجنسي<div id="b1"></div></div></div><div class="fb" id="fb"></div><div id="nx"></div>`);
 window._b=window._b||{0:[],1:[]};document.getElementById('b0').innerHTML=_b[0].map(t=>`<span>${t}</span>`).join('');document.getElementById('b1').innerHTML=_b[1].map(t=>`<span>${t}</span>`).join('');
 document.querySelectorAll('.bk').forEach(b=>b.onclick=()=>{if(document.getElementById('nx').innerHTML)return;const [t,v]=L3[i3];
  if(+b.dataset.v===v){gain(10);ok3++;_b[v].push(t);document.getElementById('fb').innerHTML=`<span style="color:var(--olive)">✓ صحيح!</span>`}else{S.no();_b[v].push(t);document.getElementById('fb').innerHTML=`<span style="color:var(--coral)">✗ مكانها الصحيح: ${v?'التكاثر اللاجنسي':'التكاثر الجنسي'}</span>`}
  i3++;document.getElementById('nx').innerHTML=`<button class="btn s" onclick="S.pop();${'i3<L3.length?lv3():intro4()'}">التالي ←</button>`})}

/* ---------- level 4: quiz race ---------- */
const L4=shuffle([["الإسفنجيات أول شعب الحيوانات في سلّم التصنيف؛ لأنها:",["لا تكوّن أنسجة حقيقية","لها عمود فقري","لها جهاز عصبي","ذاتية التغذية"],0],
["إسفنج طوله 10 cm يرشّح يوميًّا نحو:",["1 L","10 L","100 L","1000 L"],2],
["تُصنع بعض الشويكات من:",["السكر","السيليكا","الدهون","النشا"],1],
["يستجيب الإسفنج للمس بـ:",["إغلاق ثقوبه","الهرب","تغيير لونه","إفراز الحبر"],0],
["تكوّن إسفنجيات المياه العذبة البريعمات عند:",["وفرة الغذاء","الظروف القاسية كالجفاف والتجمّد","الليل","التكاثر الجنسي"],1],
["أين يحدث الهضم في الإسفنج؟",["في المعدة","في الأمعاء","داخل الخلايا","في الفم"],2],
["يحمل بعض السراطين الإسفنج على ظهره من أجل:",["التمويه","التنفّس","السباحة","التدفئة"],0],
["مادة من إسفنج المياه العميقة توقف انقسام الخلايا السرطانية:",["الديسكودرمولايد","الكافيين","الإسفنجين","الكلوروفيل"],0]]);
let i4=0,tmr=null;
function intro4(){level=3;i4=0;view(`<h2>المحطة 4: سباق اللآلئ ⏱</h2><p>ثمانية أسئلة سريعة، لكل سؤال 20 ثانية. أجيبي بسرعة: الإجابة الأسرع تمنحك نقاطًا إضافية!</p><p class="center"><button class="btn c" onclick="S.pop();lv4()">انطلقي!</button></p>`);bubbles(14)}
function lv4(){const [q,o,k]=L4[i4];let left=20,done=false;view(`<h2>سباق اللآلئ (${i4+1}/${L4.length})</h2><p><b>${q}</b></p><div class="timer"><i id="tb"></i></div><div class="grid2">${o.map((x,j)=>`<button class="opt" data-j="${j}">${['أ','ب','ج','د'][j]}) ${x}</button>`).join('')}</div><div class="fb" id="fb"></div><div id="nx"></div>`);
 const tb=document.getElementById('tb');clearInterval(tmr);tmr=setInterval(()=>{left-=.1;tb.style.width=Math.max(0,left/20*100)+'%';if(left<=0){clearInterval(tmr);finish(-1)}},100);
 function finish(j){if(done)return;done=true;clearInterval(tmr);const bs=document.querySelectorAll('.opt');bs[k].classList.add('ok');
  if(j===k){const p=10+Math.round(left/2);score+=p-10;gain(10);document.getElementById('fb').innerHTML=`<span style="color:var(--olive)">✓ ممتاز! +${p} نقطة</span>`}
  else{if(j>=0)bs[j].classList.add('no');S.no();document.getElementById('fb').innerHTML=`<span style="color:var(--coral)">${j<0?'⏰ انتهى الوقت!':'✗ الإجابة الصحيحة مظلّلة بالأخضر'}</span>`}
  i4++;document.getElementById('nx').innerHTML=`<button class="btn s" onclick="S.pop();i4<L4.length?lv4():end()">${i4<L4.length?'التالي ←':'النتيجة 🏆'}</button>`}
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>finish(+b.dataset.j))}

/* ---------- end ---------- */
function end(){level=4;S.win();bubbles(30);const max=L1.length+1+L3.length+L4.length;const st=pearls>=max-2?3:pearls>=max*0.6?2:1;
 view(`<div class="cert"><h1>🏆 أحسنتِ يا ${pname}!</h1><p>وصلتِ إلى أعمق نقطة في الشعاب وجمعتِ</p><p class="pearls">${'⚪'.repeat(pearls)}</p><h2>${pearls} لؤلؤة • ${score} نقطة</h2><p style="font-size:34px">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</p>
 <p>${st===3?'غوّاصة خبيرة بالإسفنجيات! 🌟':st===2?'أداء رائع… راجعي ما أخطأتِ فيه لتصبحي خبيرة!':'بداية جميلة! أعيدي المحاولة لتجمعي لآلئ أكثر.'}</p>
 <p style="font-size:14px">شهادة إنجاز – درس الإسفنجيات – أحياء أول ثانوي – أ. هنادي العتيبي</p></div>
 <p class="center"><button class="btn" onclick="score=0;pearls=0;window._b={0:[],1:[]};start()">العبي مرة أخرى ↻</button></p>`)}
start();bubbles(10);
</script>
</body>
</html>

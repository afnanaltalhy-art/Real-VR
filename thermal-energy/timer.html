<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مؤقت الحصة</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;800&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;font-family:Almarai,sans-serif;background:#1E3557 url(img/thermos.jpg) center/cover;display:flex;align-items:center;justify-content:center;color:#fff}
.card{background:rgba(30,53,87,.72);border:3px solid #F2C14E;border-radius:28px;padding:28px 34px;text-align:center;max-width:92vw}
h1{margin:0 0 8px;font-size:28px;color:#F2C14E}
.ring{position:relative;width:min(62vw,340px);height:min(62vw,340px);margin:10px auto}
svg{transform:rotate(-90deg)}.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(20vw,110px);font-weight:800}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
button{font:800 20px Almarai;border:0;border-radius:14px;padding:12px 18px;cursor:pointer;color:#fff;background:#1F7A80}
button.p{background:#E0622B}button.s{background:#A8741A}button.on{outline:3px solid #fff}
.done{font-size:40px;font-weight:800;color:#F2C14E;min-height:52px}</style></head><body>
<div class="card"><h1>⏱ مؤقت النشاط</h1>
<div class="row" id="pre"></div>
<div class="ring"><svg viewBox="0 0 100 100" width="100%" height="100%"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="8"/><circle id="arc" cx="50" cy="50" r="44" fill="none" stroke="#E0622B" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="num" id="num">30</div></div>
<div class="done" id="done"></div>
<div class="row"><button class="p" id="go" onclick="toggle()">▶ ابدئي</button><button class="s" onclick="reset()">↺ إعادة</button></div></div>
<audio id="tk" src="snd/tick.mp3" preload="auto" loop></audio><audio id="bl" src="snd/bell.mp3" preload="auto"></audio>
<script>
const P=[[30,'30 ث'],[60,'1 د'],[120,'2 د'],[180,'3 د'],[300,'5 د'],[480,'8 د'],[600,'10 د']];
let total=+(new URLSearchParams(location.search).get('t')||30),left=total,run=false,iv=null;
const $=i=>document.getElementById(i);
$('pre').innerHTML=P.map(p=>`<button data-t="${p[0]}" onclick="setT(${p[0]})">${p[1]}</button>`).join('');
function fmt(s){return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s}
function draw(){$('num').textContent=fmt(left);$('arc').style.strokeDashoffset=276.5*(1-left/total);document.querySelectorAll('#pre button').forEach(b=>b.classList.toggle('on',+b.dataset.t===total))}
function setT(t){total=t;reset()}
function tick(){left--;draw();if(left<=0){stop();$('done').textContent='⏰ انتهى الوقت!';const b=$('bl');b.currentTime=0;b.play().catch(()=>{})}}
function toggle(){if(run){stop();return}if(left<=0)reset();run=true;$('go').textContent='⏸ إيقاف';$('done').textContent='';$('tk').play().catch(()=>{});iv=setInterval(tick,1000)}
function stop(){run=false;clearInterval(iv);$('tk').pause();$('go').textContent='▶ ابدئي'}
function reset(){stop();left=total;$('done').textContent='';draw()}
draw();
</script></body></html>

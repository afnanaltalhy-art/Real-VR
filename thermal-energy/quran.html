<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>افتتاحية الدرس: آية نتدبرها</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;800&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>body{margin:0;min-height:100vh;font-family:Almarai,sans-serif;background:#1E3557 url(img/thermos.jpg) center/cover;display:flex;align-items:center;justify-content:center;color:#fff}
.card{background:rgba(30,53,87,.74);border:3px solid #F2C14E;border-radius:28px;padding:30px 36px;text-align:center;max-width:900px;margin:16px}
h1{margin:0 0 14px;color:#F2C14E;font-size:28px}.ay{font-family:'Amiri Quran',serif;font-size:clamp(24px,3.6vw,40px);line-height:2.1}
.sr{color:#F2C14E;font-weight:800;margin:8px 0 18px}button{font:800 22px Almarai;border:0;border-radius:16px;padding:14px 26px;background:#B24A22;color:#fff;cursor:pointer;border:2px solid #F2C14E}
audio{display:block;margin:16px auto 0;width:min(100%,420px)}</style></head><body><div class="card"><h1>افتتاحية الدرس: آيةٌ نتدبّرها</h1>
<div class="ay">﴿وَاللَّهُ جَعَلَ لَكُم مِّمَّا خَلَقَ ظِلَالًا وَجَعَلَ لَكُم مِّنَ الْجِبَالِ أَكْنَانًا وَجَعَلَ لَكُمْ سَرَابِيلَ تَقِيكُمُ الْحَرَّ وَسَرَابِيلَ تَقِيكُم بَأْسَكُمْ ۚ كَذَٰلِكَ يُتِمُّ نِعْمَتَهُ عَلَيْكُمْ لَعَلَّكُمْ تُسْلِمُونَ﴾</div>
<div class="sr">[سورة النحل: 81]</div><button onclick="document.getElementById('a').play()">▶ اضغطي للاستماع إلى التلاوة</button>
<audio id="a" src="snd/quran.mp3" controls preload="auto"></audio></div></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>أمنيتي لطفلي</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f3fb;font-family:Tahoma,Arial,sans-serif;color:#514168}.wrap{max-width:520px;margin:auto;padding:18px}h1{text-align:center;font-size:25px;margin:10px 0}p{text-align:center;line-height:1.8}.panel{background:white;border-radius:22px;padding:18px;box-shadow:0 6px 25px #78638b20}label{display:block;font-weight:bold;margin:15px 0 7px}input,textarea{width:100%;font:17px Tahoma,Arial;padding:13px;border:2px solid #ded0ed;border-radius:12px;outline:none;direction:rtl}textarea{height:125px;resize:vertical}button{border:0;border-radius:13px;background:#8061ae;color:white;font-size:18px;font-weight:bold;padding:14px;width:100%;margin-top:16px;cursor:pointer}.preview{width:100%;border-radius:15px;margin-top:20px;border:1px solid #eee}small{display:block;text-align:center;line-height:1.8;color:#756b81;margin-top:10px}</style></head><body><div class="wrap"><h1>💜 أمنيتي لطفلي</h1><p>اكتبي اسم طفلك وأمنيتك له، ثم احفظي البطاقة وأرسليها إلى معلمته عبر الواتساب.</p><div class="panel"><label for="child">اسم الطفل</label><input id="child" maxlength="65" placeholder="اكتبي اسم الطفل"><label for="wish">أمنيتي لطفلي</label><textarea id="wish" maxlength="330" placeholder="أتمنى لطفلي أن..."></textarea><button id="save">حفظ البطاقة كصورة</button><canvas id="card" class="preview" width="900" height="1150"></canvas><small>البطاقة تُنشأ على جهازك، ولا تُرسل البيانات إلى أي موقع. إذا لم يبدأ الحفظ على الآيفون، اضغطي مطولًا على صورة البطاقة لحفظها.</small></div></div><script>
const c=document.getElementById('card'),ctx=c.getContext('2d'),child=document.getElementById('child'),wish=document.getElementById('wish');
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}}
function txt(t,x,y,size,color='#5c4977',weight='normal'){ctx.fillStyle=color;ctx.font=`${weight} ${size}px Tahoma, Arial, sans-serif`;ctx.textAlign='center';ctx.direction='rtl';ctx.fillText(t,x,y)}
function wrapText(s,maxWidth,font){ctx.font=font;let words=s.trim().split(/\s+/),lines=[],line='';for(const word of words){let candidate=line?line+' '+word:word;if(ctx.measureText(candidate).width>maxWidth&&line){lines.push(line);line=word}else line=candidate}if(line)lines.push(line);return lines}
function draw(){const w=900;ctx.fillStyle='#faf5ff';ctx.fillRect(0,0,900,1150);ctx.fillStyle='#eee1fa';ctx.beginPath();ctx.arc(90,70,180,0,7);ctx.fill();ctx.fillStyle='#fbe3ee';ctx.beginPath();ctx.arc(840,1080,200,0,7);ctx.fill();rounded(40,42,820,1060,40,'#fffdfd','#ddc6ef');rounded(66,70,768,990,35,'#fffafc','#eee0f4');txt('✦    ♡    ✦',450,147,45,'#c89ac8');txt('مدرسة عكرمة للطفولة المبكرة',450,214,30,'#8468a0','bold');txt('اليوم العالمي للطفل 2026',450,270,30,'#8d7c9d');txt('نحن أمانة',450,331,38,'#8c5da3','bold');rounded(155,380,590,94,36,'#eee1f8');txt('أمنيتي لطفلي',450,446,55,'#74549b','bold');txt('من قلبي إلى قلب طفلي',450,521,30,'#a080ac');rounded(116,564,668,326,25,'#ffffff','#d8c0e7');txt('♡',450,624,45,'#c999b9');let s=wish.value.trim()||'هنا تُكتب أمنية جميلة لطفلك...';let font='34px Tahoma, Arial, sans-serif',lines=wrapText(s,580,font);if(lines.length>6){font='27px Tahoma, Arial, sans-serif';lines=wrapText(s,590,font)}if(lines.length>8){font='23px Tahoma, Arial, sans-serif';lines=wrapText(s,600,font)}ctx.font=font;ctx.textAlign='center';ctx.direction='rtl';ctx.fillStyle='#604c78';let lineHeight=font.startsWith('34')?51:font.startsWith('27')?42:34;let yy=700;for(let i=0;i<Math.min(lines.length,8);i++)ctx.fillText(lines[i],450,yy+i*lineHeight);rounded(155,920,590,77,30,'#f5eaf8');txt('اسم الطفل: '+(child.value.trim()||'........................'),450,974,29,'#735b8e','bold');txt('رائدة النشاط: أمل الياسي',450,1026,23,'#765b94','bold');txt('مديرة المدرسة: عبير الوقداني',450,1063,23,'#765b94','bold')}
child.addEventListener('input',draw);wish.addEventListener('input',draw);document.getElementById('save').addEventListener('click',()=>{draw();const a=document.createElement('a');a.download='أمنيتي_لطفلي.png';a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove()});draw();
</script></body></html>
